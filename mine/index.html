<main class="screen">
  <div class="nav"><span class="navl"><svg class="aplogo" viewBox="0 0 228.41 58.35" fill="currentColor" role="img" aria-label="A-PUSH"><use href="#aplogo"/></svg><span class="mini">テスト</span></span></div>
  <h1 class="large">テスト</h1>
  <p class="sub">試験のトレーニングと毎日の英語</p>
  <div id="ap-book"></div>  <!-- コーチと気楽に英語学習の相談をする（book.js。2026-11-11 計画から移動） -->

  <!-- あなた専用（2026-11-03）：毎日のスピーキング＆ライティング → 試験（英検は級を選ぶ一覧へ）。スマホで押しやすい大きなカード -->
  <style>
  .mh{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
  .mlist{display:grid;gap:10px}
  .mcard{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--card);border-radius:18px;padding:16px;transition:transform .1s ease-out}
  .mcard:active{transform:scale(.98)}
  .mcard b{display:block;font-size:17px;line-height:1.3}
  .mcard small{display:block;color:var(--mute);font-size:13px;margin-top:3px;line-height:1.4}
  .mcard .go{font-family:var(--en);font-weight:900;color:var(--brand);font-size:18px;flex:none}
  .mcard.main{background:var(--brand);color:var(--on)}.mcard.main small,.mcard.main .go{color:var(--on)}
  .mtwo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mtwo .mcard{flex-direction:column;align-items:flex-start;gap:6px;min-height:96px}
  .mtwo .mcard .go{align-self:flex-end;margin-top:auto}
  @media (min-width:1024px){
    .mlist{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    .mtwo{grid-template-columns:repeat(2,minmax(0,420px))}
    .mtwo .mcard{min-height:120px}
    .mcard{padding:20px}
    .mcard:hover{box-shadow:0 0 0 1.5px var(--brand) inset}
  }
  </style>
  <div id="daily" hidden>
    <p class="mh">毎日：スピーキング＆ライティング</p>
    <div class="mtwo">
      <a class="mcard main" href="/exam/?daily=speaking"><span><b>🎤 話す</b><small>今日のことを30秒〜7分</small></span><span class="go">→</span></a>
      <a class="mcard main" href="/exam/?daily=writing"><span><b>✍️ 書く</b><small>今日のことを50〜150語</small></span><span class="go">→</span></a>
    </div>
    <p class="note" style="margin:8px 2px 0">今日の単語を3つ使うと、AI が10点満点で評価して、直した文と次に直す1つを返します。</p>
  </div>
  <p class="mh" id="mine-note">準備中です。先生があなたのための教材を用意したら、ここに出ます。</p>
  <div class="mlist" id="exam-list"></div>
<script>
/* 設定の exams を一覧に。問題は /exam/<id>.json、画面は /exam/。同じ group（英検の各級）は1つにまとめる */
(function(){var S=window.SITE||{},ex=S.exams||[];
  if(S.daily)document.getElementById("daily").hidden=false;
  if(!ex.length)return;
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  var bank=ex.some(function(e){return e.bank;});
  document.getElementById("mine-note").textContent=bank?"試験のトレーニング":"模擬テスト";
  var seen={};ex=ex.filter(function(e){if(!e.group)return true;if(seen[e.group])return false;seen[e.group]=1;return true;}).map(function(e){return e.group?{id:e.group,isGroup:true,title:e.groupTitle||e.group,desc:"4級〜1級"}:e;});
  document.getElementById("exam-list").innerHTML=ex.map(function(e){var href=e.isGroup?"/exam/?group="+encodeURIComponent(e.id):e.bank?"/exam/?exam="+encodeURIComponent(e.id):"/exam/?id="+encodeURIComponent(e.id);
    var desc=e.isGroup?e.desc+" ・ 10分・チャレンジ・チャプター別":e.bank?"10分・チャレンジ・チャプター別":(e.desc||"");
    return '<a class="mcard" href="'+href+'"><span><b>'+esc(e.title)+'</b><small>'+esc(desc)+'</small></span><span class="go">'+(e.minutes?"約"+e.minutes+"分 →":"→")+'</span></a>';}).join("");
})();
</script>
