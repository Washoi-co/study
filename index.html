<style>
/* 生徒用「章の録音」（2026-11-16 kimi：A-PUSHメソッドを外して、計画の「今日の復習」から章ごとに録音）。
   会員番号＋パスワードで data.enc を復号 → 章の6問を通して声に出して録音（30秒以上で「できた」）。
   録音はどこにも送らない。毎週1本だけ、この端末の IndexedDB（ap_growth）に成長記録として残す。見た目は /ui.css */
.en{font-family:var(--en)}
#app{display:flex;flex-direction:column;gap:12px}
#who:empty{display:none}

/* 章を選ぶ */
.chrow{display:flex;gap:8px;align-items:center}

.chrow button:disabled{opacity:.3;cursor:default}

/* 章の6問（全部並べる） */
.meta b{color:var(--brand)}
.it{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:.5px solid var(--line2)}

/* 録音 */
.rec{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;border-top:.5px solid var(--line2)}
.rec .say{margin:0}

.recbtn{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--brand);border-radius:99px;padding:11px 20px;font-size:15px;font-weight:700;transition:transform .1s ease-out}
.recbtn:active{transform:scale(.97)}
.recbtn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ng)}
.recbtn.on{background:var(--ng);color:#fff}

@keyframes blink{50%{opacity:.3}}
.rec audio,.gw audio{width:100%;max-width:360px;height:40px;margin:0 auto;display:block}
.recmsg{font-size:12.5px;color:var(--mute);margin:0;min-height:1.2em;text-align:center}
.recmsg.ok{color:var(--ok)} .recmsg.ng{color:var(--ng)}

/* あなたの記録・成長記録 */
.log{background:var(--card);border-radius:var(--r);padding:12px 14px}
.log summary{cursor:pointer;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px;list-style:none}
.log summary::-webkit-details-marker{display:none}
.log summary::after{content:"›";color:var(--mute);transition:transform .2s}
.log[open] summary::after{transform:rotate(90deg)}
.log summary .en{margin-left:auto;color:var(--brand)}
.log .tiles{margin:12px 0 10px}
.log .tiles div{background:var(--bg)}
.log .cal span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.log .cal span.on{background:var(--brand);color:var(--on);font-weight:700}
.log .cal span.today{box-shadow:0 0 0 2px var(--ink) inset;color:var(--ink);font-weight:700}
.log .cal span.on.today{color:var(--on)}
.gw{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:.5px solid var(--line2)}
.gw:first-of-type{margin-top:10px}
.gw .gh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.gw .gh small{color:var(--mute)}
.gw .ghost{flex:none;padding:10px;font-size:14px;text-align:center;text-decoration:none}
.gempty{margin:10px 0 0;font-size:13px;color:var(--mute)}

<script src="/activity.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem("ap_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem("ap_"+k,JSON.stringify(v));}catch(e){}}};
function speak(t){if(window.apSay)return apSay(t.replace(/\(.*?\)/g,""));try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,""));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}

let DATA=null, LV="b", CH=0, TODO=[];   /* TODO：今日の復習の章（?ch= か ap_today）。1章できたら次へ */
let ME=null;   /* この生徒だけの鍵 {sid, tok 管理アプリ}。パスワードで開けるたびに作り直す（localStorage に置かない） */
let TRACK=null;   /* 専門（ビジネス英語・土木英語）：その専門の生徒だけ、レベルの並びに専門（id "z"）が1つ増える */
const MIN=30;   /* 録音は30秒以上で「できた」（前の LINE の提出と同じ） */
const LEVELS=()=>DATA.levels;
/* 絵の無い章（ビジネス）は、絵文字を絵の代わりに */
const picOf=it=>it.pic||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120"><text x="80" y="62" font-size="72" text-anchor="middle" dominant-baseline="middle">'+(it.e||"💼")+'</text></svg>');
const level=()=>DATA.levels.find(l=>l.id===LV);
const chapter=()=>level().chapters[CH];

/* ---- 会員番号とパスワードで復号（生徒ごとに包んだデータ鍵を開けて、教材を開ける） ---- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const dec=async(key,box)=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(box.i)},key,b64(box.c)));
async function unlock(sid,pass,as){   /* as：体験コードの時だけ {sid, tok}（名簿の体験の生徒）。箱は TRIAL */
  const enc=await (await fetch("data.enc",{cache:"no-cache"})).json();
  const box=enc.keys[sid];if(!box)throw new Error("no such id");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(box.s),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const me=JSON.parse(await dec(kek,box));
  const dkey=await crypto.subtle.importKey("raw",b64(me.k),"AES-GCM",false,["decrypt"]);
  store.set("name",me.name);
  ME=as||{sid:sid,tok:me.tok||""};
  (window.aps=window.aps||[]).push(["profile",{sid:ME.sid,name:me.name,fixed:true,tok:ME.tok}]);   /* 会員番号＝生徒ID（管理アプリの名簿のID） */
  const data=JSON.parse(await dec(dkey,enc));
  TRACK=me.track||null;
  const tb=TRACK&&me.kb&&enc.t&&enc.t[TRACK.id];
  if(tb){   /* 専門の章：その専門の生徒にだけ鍵がある */
    const bk=await crypto.subtle.importKey("raw",b64(me.kb),"AES-GCM",false,["decrypt"]);
    data.levels.push(JSON.parse(await dec(bk,tb)));
    if(TRACK.only)data.levels=data.levels.filter(l=>l.id==="z");   /* 全部専門仕様の生徒（students.json の only）：Beginner・Intermediate は出さない（2026-11-15 kimi） */
  }
  store.set("track",TRACK);   /* 単語のページが読む（専門のコースの出し方） */
  store.set("pk",me.pk||null);   /* 単語帳・模擬テストの plus（本生徒だけの問題）を開ける鍵（2026-11-04 監査 M1） */
  return data;
}
const normSid=s=>{const t=String(s||"").normalize("NFKC").trim().toUpperCase(),n=t.replace(/[^0-9]/g,"");return /^(STU)?\s*[0-9]+$/.test(t)&&n?"STU"+n.padStart(3,"0"):t.replace(/[^A-Z0-9]/g,"");};  // stu5・STU 005・５ → STU005。英字入り（PRERAKA001 など）は英数字だけ大文字で（kanri の teacher.js と同じ決まり。2026-11-15）
$("lock").addEventListener("submit",async e=>{
  e.preventDefault();
  $("lock-go").disabled=true;$("lock-err").textContent="";
  const sid=normSid($("sid").value),pass=$("pass").value.trim();
  try{
    DATA=await unlock(sid,pass);
    store.set("sid",sid);store.set("pass",pass);
    start();
  }catch(err){$("lock-err").textContent="会員番号かパスワードが違います。";}
  $("lock-go").disabled=false;
});
/* 体験コード（2026-11-09 の名刺・ドボプロ 11/23 まで）：kanri の trial に聞いて、期間のあいだだけ体験の箱（TRIAL）で開ける。開くたびに聞く＝期限はサーバーが守る */
const apCall=(name,data)=>new Promise((ok,ng)=>{let n=0;const t=setInterval(()=>{if(window.APushSync){clearInterval(t);window.APushSync.call(name,data).then(ok,ng);}else if(++n>100){clearInterval(t);ng(new Error("no sync"));}},100);});
const trialMsg=e=>/^functions\/(not-found|permission-denied|failed-precondition|resource-exhausted)$/.test(e&&e.code||"")?e.message:"つながりませんでした。もう一度押してください。";
async function trialOpen(code){
  const r=(await apCall("trial",{code})).data;
  return unlock("TRIAL",r.pass,{sid:r.sid,tok:r.tok});
}
$("trial-go").addEventListener("click",async()=>{
  const code=$("tcode").value.trim();if(!code){$("tcode").focus();return;}
  $("trial-go").disabled=true;$("lock-err").textContent="";
  try{DATA=await trialOpen(code);store.set("tcode",code);start();}
  catch(err){$("lock-err").textContent=trialMsg(err);}
  $("trial-go").disabled=false;
});
(async()=>{
  const u=new URLSearchParams(location.search).get("sid");
  $("sid").value=u||store.get("sid","");
  const p=store.get("pass",null),sid=store.get("sid","");
  if(p&&sid&&(!u||u===sid)){try{DATA=await unlock(sid,p);start();return;}catch(e){}}
  const tc=store.get("tcode",null);
  if(tc&&!u){
    try{DATA=await trialOpen(tc);start();return;}
    catch(e){$("lock-err").textContent=trialMsg(e);if(/permission-denied|failed-precondition/.test(e&&e.code||"")){store.set("tcode",null);store.set("pk",null);}}   /* 期限切れ：模擬テストの鍵も消す */
  }
  ($("sid").value?$("pass"):$("sid")).focus();
})();

/* ---- 画面の組み立て ---- */
/* 開く章：?lv=b&ch=5,7（LINE のリマインド・計画から）→ ap_today（今日の復習。sync.js が入れる）→ 前に開いた章 */
const tOk=t=>t&&t.day===dayAgo(0)&&Array.isArray(t.ch);
function start(){
  $("lock").hidden=true;$("app").hidden=false;
  LV=store.get("lv","b");if(!LEVELS().some(l=>l.id===LV))LV=LEVELS()[0].id;
  CH=store.get("ch_"+LV,0);
  const q=new URLSearchParams(location.search);
  if(LEVELS().some(l=>l.id===q.get("lv"))&&q.get("ch")){
    LV=q.get("lv");store.set("lv",LV);
    pickTodo(q.get("ch").split(",").map(n=>level().chapters.findIndex(c=>String(c.n)===n.trim())));
  }else if(tOk(store.get("today",null)))todayCh(store.get("today",null));
  else addEventListener("ap-today",()=>{const t=store.get("today",null);if(tOk(t)&&!busy()&&todayCh(t))go(CH);},{once:true});   // 今日はじめて開いた＝つながってから届く
  if(q.toString())history.replaceState(null,"",location.pathname);
  $("levels").innerHTML=LEVELS().map(l=>'<button data-lv="'+l.id+'">'+esc(l.name)+'</button>').join("");
  $("who").textContent=store.get("name","")+" さん";
  go(CH);paintLog();paintGrowth();
}
function pickTodo(ix){
  TODO=ix.filter(i=>i>=0);
  CH=TODO.length?TODO[0]:store.get("ch_"+LV,0);
}
function todayCh(t){
  if(!LEVELS().some(l=>l.id===t.lv))return false;
  LV=t.lv;store.set("lv",LV);
  pickTodo(t.ch.map(n=>level().chapters.findIndex(c=>c.n===n)));
  return true;
}
$("who").addEventListener("click",()=>{
  if(confirm("ログアウトしますか？（次に開くとき、会員番号とパスワードがもう一度必要です）")){store.set("pass",null);location.reload();}
});
function go(ch){
  stopRec(true);
  CH=level().chapters[ch]?ch:0;store.set("ch_"+LV,CH);
  document.querySelectorAll("[data-lv]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lv===LV)));
  let html="",u=null;
  level().chapters.forEach((c,i)=>{
    if(c.u!==u){if(u)html+="</optgroup>";u=c.u;html+='<optgroup label="'+esc(level().name)+" "+u+'">';}
    html+='<option value="'+i+'">Ch '+c.n+"　"+esc(c.title)+"</option>";
  });
  $("chsel").innerHTML=html+"</optgroup>";
  $("chsel").value=CH;
  $("prev").disabled=CH===0;$("next").disabled=CH===level().chapters.length-1;
  segSlide("levels");
  const c=chapter(),k=TODO.indexOf(CH);
  $("chname").textContent=level().name+" Ch "+c.n+"　"+c.title;
  $("todo").textContent=k>=0?"今日の復習 "+(k+1)+" / "+TODO.length:"";
  $("items").innerHTML=c.items.map((it,i)=>'<div class="it">'+
    '<img class="pic" src="'+esc(picOf(it))+'" alt="Ch '+c.n+' の絵 '+(i+1)+'">'+
    '<div class="tq"><span class="who-t">T</span><p>'+esc(it.t)+'</p><button class="tsay" data-say="t'+i+'" aria-label="質問を聞く">▶</button></div>'+
    (it.tj?'<p class="tj">'+esc(it.tj)+'</p>':'')+
    '<div class="tq s"><span class="who-t">S</span><p>'+esc(it.s)+'</p><button class="tsay" data-say="s'+i+'" aria-label="答えを聞く">▶</button></div>'+
    (it.sj?'<p class="tj">'+esc(it.sj)+'</p>':'')+'</div>').join("");
  resetRec();
}
$("items").addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)speak(chapter().items[+b.dataset.say.slice(1)][b.dataset.say[0]]);});
$("levels").addEventListener("click",e=>{
  const b=e.target.closest("[data-lv]");if(!b||b.dataset.lv===LV)return;
  LV=b.dataset.lv;store.set("lv",LV);go(store.get("ch_"+LV,0));
});
$("chsel").addEventListener("change",()=>go(+$("chsel").value));
$("prev").addEventListener("click",()=>go(CH-1));
$("next").addEventListener("click",()=>go(CH+1));
$("btn-nextch").addEventListener("click",()=>{go(TODO[TODO.indexOf(CH)+1]);$("app").scrollIntoView({behavior:"smooth",block:"start"});});

/* 切り替え（セグメント）の白い板を、押した所へすべらせる（doboku の engine.js と同じ） */
function segSlide(id){
  const el=$(id);if(!el)return;
  let i=el.querySelector(".sl");
  if(!i){i=document.createElement("i");i.className="sl";el.insertBefore(i,el.firstChild);}
  const btns=[...el.querySelectorAll("button")];if(!btns.length)return;
  const n=btns.findIndex(b=>b.getAttribute("aria-pressed")==="true");
  i.hidden=n<0;if(n<0)return;
  i.style.width="calc((100% - 4px) / "+btns.length+")";
  i.style.transform="translateX("+n*100+"%)";
}

/* ---- 録音（この端末の中だけ。どこにも送らない） ---- */
let rec=null, chunks=[], stream=null, t0=0, tick=null, last=null;   /* last：止めた録音 {blob, mime, sec} */
const MIME=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
const busy=()=>rec&&rec.state==="recording";
const msg=(t,c)=>{$("rec-msg").textContent=t;$("rec-msg").className="recmsg"+(c?" "+c:"");};
function resetRec(){
  $("rec-done").hidden=true;$("rec-btn").hidden=false;$("btn-nextch").hidden=true;
  $("rec-btn").textContent="録音する";$("rec-btn").classList.remove("on");
  $("rec-ok").disabled=true;last=null;msg("");
  $("rec").hidden=!window.MediaRecorder;
}
function stopRec(discard){
  clearInterval(tick);
  if(busy()){if(discard)rec.onstop=null;rec.stop();}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}
$("rec-btn").addEventListener("click",async()=>{
  if(busy()){stopRec(false);return;}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){msg("マイクが使えません。ブラウザの設定でマイクを許可してください。","ng");return;}
  chunks=[];
  rec=new MediaRecorder(stream,MIME?{mimeType:MIME}:undefined);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const sec=Math.floor((Date.now()-t0)/1000),mime=rec.mimeType||MIME||"audio/webm";
    last={blob:new Blob(chunks,{type:mime}),mime,sec};
    $("rec-audio").src=URL.createObjectURL(last.blob);
    $("rec-btn").hidden=true;$("rec-done").hidden=false;
    $("rec-ok").disabled=sec<MIN;
    sec<MIN?msg("短いです。あと"+(MIN-sec)+"秒。章を通して、もう一度録音してください。","ng"):msg(sec+"秒。聞き直して、よければ「できた」");
  };
  rec.start();t0=Date.now();
  $("rec-btn").textContent="止める";$("rec-btn").classList.add("on");
  const show=()=>{const s=Math.floor((Date.now()-t0)/1000);msg("録音中 "+s+"秒"+(s<MIN?"（あと"+(MIN-s)+"秒）":"　言い終わったら「止める」"));};
  show();tick=setInterval(show,1000);
});
$("rec-redo").addEventListener("click",resetRec);
$("rec-ok").addEventListener("click",async()=>{
  if(!last||last.sec<MIN)return;
  $("rec-ok").disabled=true;
  const c=chapter(),title=level().name+" Ch."+c.n;
  apMark("rec",1,title);markToday();
  const done=store.get("done_"+LV,[]);   /* 録音できた章＝章クリア。名簿の cleared へ（管理サイト・先生用の入口の「マスターした章」） */
  if(!done.includes(c.n)){done.push(c.n);store.set("done_"+LV,done);}
  (window.aps=window.aps||[]).push(["cleared",{b:store.get("done_b",[]),i:store.get("done_i",[]),z:store.get("done_z",[])}]);
  const kept=await keepWeek({blob:last.blob,mime:last.mime,sec:last.sec,lv:LV,ch:c.n,title,at:new Date().toISOString()});
  msg("できた。"+(kept===true?"今週の成長記録に残しました。":kept===false?"今週の分はもう残っています。":""),"ok");
  paintGrowth();
  const nt=TODO[TODO.indexOf(CH)+1];
  if(TODO.includes(CH)&&nt!==undefined){$("btn-nextch").textContent="次の復習へ（Ch "+level().chapters[nt].n+"）";$("btn-nextch").hidden=false;}
});

/* ---- 成長記録：毎週1本だけ（その週に最初に「できた」の録音）。IndexedDB ap_growth、キー＝週の月曜（日本時間）。最大52週 ---- */
const weekOf=()=>{const d=new Date(Date.now()+9*36e5);d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);return d.toISOString().slice(0,10);};
function gdb(mode,f){   // f(store) の返す物を、終わってから渡す。使えない端末は reject
  return new Promise((ok,ng)=>{
    if(!window.indexedDB)return ng();
    const o=indexedDB.open("ap_growth",1);
    o.onupgradeneeded=()=>o.result.createObjectStore("w");
    o.onerror=()=>ng(o.error);
    o.onsuccess=()=>{try{const t=o.result.transaction("w",mode),r=f(t.objectStore("w"));t.oncomplete=()=>ok(r);t.onerror=t.onabort=()=>ng(t.error);}catch(e){ng(e);}};
  });
}
// true＝残した／false＝今週の分はもう有る／null＝この端末では残せない（黙って残さない）
const keepWeek=v=>gdb("readwrite",s=>{const r=s.add(v,weekOf());r.onerror=e=>e.preventDefault();return r;}).then(r=>!r.error,()=>null);
let gurls=[];
function paintGrowth(){
  const old=new Date(Date.parse(weekOf())-364*864e5).toISOString().slice(0,10);   // 52週前の月曜。これ以前は消す（今週＋51週＝最大52本）
  gdb("readwrite",s=>{
    const r={k:s.getAllKeys(),v:s.getAll()};
    r.k.onsuccess=()=>r.k.result.filter(k=>k<=old).forEach(k=>s.delete(k));
    return r;
  }).then(r=>{
    gurls.forEach(URL.revokeObjectURL);gurls=[];
    const rows=r.k.result.map((k,i)=>[k,r.v.result[i]]).filter(([k])=>k>old).reverse();
    $("g-sum").textContent=rows.length?rows.length+"週":"";
    $("g-list").innerHTML=rows.length?rows.map(([k,v])=>{
      const u=URL.createObjectURL(v.blob),name="A-PUSH_"+k+(/mp4/.test(v.mime)?".m4a":".webm");gurls.push(u);
      const f=new File([v.blob],name,{type:v.mime}),share=navigator.canShare&&navigator.canShare({files:[f]});
      return '<div class="gw"><div class="gh"><b>'+(+k.slice(5,7))+"/"+(+k.slice(8))+' の週</b><small>'+esc(v.title)+"・"+v.sec+'秒</small></div>'+
        '<audio controls preload="none" src="'+u+'"></audio>'+
        '<div class="acts">'+(share?'<button class="ghost" data-send="'+k+'">送る</button>':'<a class="ghost" href="'+u+'" download="'+name+'">保存する</a>')+'</div></div>';
    }).join(""):'<p class="gempty">毎週、最初に「できた」になった録音が1本ここに残ります。週ごとに聞き比べられます。</p>';
    G=Object.fromEntries(rows);
  },()=>{$("growth").hidden=true;});
}
let G={};
$("g-list").addEventListener("click",e=>{
  const b=e.target.closest("[data-send]");if(!b)return;
  const k=b.dataset.send,v=G[k];if(!v)return;
  const f=new File([v.blob],"A-PUSH_"+k+(/mp4/.test(v.mime)?".m4a":".webm"),{type:v.mime});
  navigator.share({files:[f],title:"A-PUSH 成長記録 "+k}).catch(()=>{});   // LINE などで先生に送る
});

/* ---- 記録：録音できた日を数える（この端末だけ） ---- */
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d);};
function streak(days){
  let n=days.includes(dayAgo(0))?0:1,k=0;  // 今日まだでも、昨日やっていれば続いている
  while(days.includes(dayAgo(n+k)))k++;
  return k;
}
function paintLog(){
  const days=store.get("days",[]),st=streak(days);
  $("log-streak").textContent=st;$("log-days").textContent=days.length;
  $("log-sum").textContent=st?"🔥 "+st+"日":"";
  let html="";
  for(let n=27;n>=0;n--){const d=dayAgo(n);html+='<span class="'+(days.includes(d)?"on":"")+(n===0?" today":"")+'" title="'+d+'">'+(+d.slice(8))+'</span>';}
  $("log-cal").innerHTML=html;
}
function markToday(){
  const days=store.get("days",[]);
  if(!days.includes(dayAgo(0))){days.push(dayAgo(0));store.set("days",days);}
  paintLog();
}
