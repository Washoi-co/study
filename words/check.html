<script>
// 本コース：単語帳を開ける鍵（ap_pk）が無ければ、トップで開け直す（words/index.html と同じ）
try{ if(!JSON.parse(localStorage.getItem("ap_pass"))||!JSON.parse(localStorage.getItem("ap_pk"))) location.replace("/"); }catch(e){ location.replace("/"); }
// 土木のコースは、その専門の生徒だけ。Business は本コースの全員に出す（2026-10-21 kimi・words/index.html と同じ）
(function(){ var tr=null;try{tr=JSON.parse(localStorage.getItem("ap_track"));}catch(e){} var mine=tr&&tr.words;
  APW_COURSES=APW_COURSES.filter(function(x){ return ["土木"].indexOf(x.g)<0||x.g===mine; });
  if(tr&&tr.groups)APW_COURSES=APW_COURSES.filter(function(x){ return tr.groups.indexOf(x.g)>=0; });   // 全部専門仕様の生徒（only）：General・Native＋専門だけ（2026-11-15 kimi）
})();
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function speak(t){if(window.apSay)return apSay(t);try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const PER=6, PASS=5;  // 1レベル6問、5問以上で次へ
const TRACKS=[
  {g:"General",d:"中学〜高校の基本。日常会話の土台"},
  {g:"TOEIC",d:"仕事・ビジネスの英語"},
  {g:"IELTS",d:"留学・移住。アカデミックな英語"},
  {g:"TOEFL iBT",d:"アメリカなどへの留学"},
  // 2026-10-21：ネイティブのフレーズ・スラングは、それぞれ1レベルだけ（ids で選ぶ）
  {g:"ネイティブ",ids:["native"],d:"会話でよく使うフレーズ"},
  {g:"スラング",ids:["slang"],d:"SNS・話し言葉の、今どきの英語"},
  // ビジネスは本コースの全員に。チェックは基本200〜レベル4だけ（biz5〜10 は分野別でレベルではない）
  {g:"Business",ids:["biz0","biz1","biz2","biz3","biz4"],d:"仕事で使う英語。基本から経営・海外ビジネスまで"},
];
const levelsOf=t=>APW_COURSES.filter(c=>t.ids?t.ids.indexOf(c.id)>=0:c.g===t.g);
const nm=l=>R.g===l.t?l.t:R.g+" "+l.t;  // 「スラング スラング」と重ねない
/* 専門の生徒（土木）には、その専門も目的に出す */
(function(){
  var tr=null;try{tr=JSON.parse(localStorage.getItem("ap_track"));}catch(e){}
  var D={"Business":"仕事で使う英語。基本から経営・海外ビジネスまで","土木":"現場で使う英語。道具・材料から安全・管理まで"};
  if(tr&&tr.words&&!TRACKS.some(function(t){return t.g===tr.words;})&&APW_COURSES.some(function(c){return c.g===tr.words;}))TRACKS.push({g:tr.words,d:D[tr.words]||tr.label});
})();
try{var lc=JSON.parse(localStorage.getItem("ap_levelcheck")||"null");if(localStorage.getItem("apush-words-course")||(lc&&lc.id))$("to-words").hidden=false;}catch(e){}   // チェック済みなら「単語へ」を出す（単語のページが結果のコースを開く。2026-11-12）

$("tracks").innerHTML=TRACKS.map((t,i)=>{
  const lv=levelsOf(t);
  if(!lv.length)return "";  // そのサイトに無いコースは出さない
  const range=lv.length>1?'（'+lv[0].t+'〜'+lv[lv.length-1].t+'）':'';
  return '<button class="row" data-i="'+i+'"><span><b>'+t.g+'</b><small>'+t.d+range+'</small></span><span class="go">チェック ›</span></button>';
}).join("");
$("tracks").onclick=e=>{const b=e.target.closest("[data-i]");if(b)start(TRACKS[+b.dataset.i]);};

// コースのファイルは apWords（activity.js）で読む
const loaded={};
const load=id=>loaded[id]?Promise.resolve(loaded[id]):apWords(id).then(C=>{if(!C)throw 0;return loaded[id]=C;});

let R=null;  // {g, levels, li, qs, qi, right, scores}
async function start(t){
  R={g:t.g,levels:levelsOf(t),li:0,scores:[]};
  await level();
}
async function level(){
  const lv=R.levels[R.li],C=await load(lv.id),W=C.words;
  R.qs=shuffle(W.map((_,i)=>i)).slice(0,PER).map(wi=>{
    const right=W[wi][1][0][0];
    const others=shuffle(W.filter((_,i)=>i!==wi).map(w=>w[1][0][0]).filter(m=>m!==right)).slice(0,3);
    return {en:W[wi][0],right,opts:shuffle([right,...others])};
  });
  R.qi=0;R.right=0;
  ["v-pick","v-res"].forEach(v=>$(v).hidden=true);$("v-q").hidden=false;
  ask();
}
function ask(){
  const q=R.qs[R.qi],lv=R.levels[R.li];
  $("q-level").textContent=nm(lv)+(R.levels.length>1?"（"+(R.li+1)+" / "+R.levels.length+" レベル）":"");
  $("q-count").textContent=(R.qi+1)+" / "+PER;
  $("q-word").textContent=q.en;speak(q.en);
  $("q-choices").innerHTML=q.opts.map((o,n)=>'<button class="ch"><span class="k">'+(n+1)+'</span><span>'+o.replace(/[&<>]/g,"")+'</span></button>').join("")+'<button class="ch idk" data-idk="1">わからない</button>';
  window.scrollTo(0,0);
}
$("q-say").onclick=()=>speak(R.qs[R.qi].en);
$("q-choices").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(!b.dataset.idk&&b.lastElementChild.textContent===R.qs[R.qi].right.replace(/[&<>]/g,""))R.right++;
  if(R.qi<PER-1){R.qi++;ask();return;}
  R.scores.push(R.right);
  // 5問以上わかったら次のレベル。わからなかったレベルがおすすめ
  if(R.right>=PASS&&R.li<R.levels.length-1){R.li++;level();return;}
  result();
};
function result(){
  const passedAll=R.right>=PASS, rec=R.levels[R.li];
  $("r-course").textContent=nm(rec);
  $("r-msg").textContent=passedAll?"いちばん上のレベルまで、ほとんどわかりました。このコースで仕上げましょう。"
    :R.li===0?"まずはこのレベルから。知らない単語を、絵と声で毎日覚えていきましょう。"
    :"ひとつ下のレベルはほとんどわかりました。このレベルから始めると、ちょうどいい難しさです。";
  $("r-levels").innerHTML=R.levels.map((l,i)=>{
    const s=R.scores[i];
    return '<div><span>'+nm(l)+'</span>'+(s==null?'<span class="s">—</span>':'<span class="'+(s>=PASS?"y":"n")+'">'+s+" / "+PER+'</span>')+'</div>';
  }).join("");
  $("r-start").href="./?c="+rec.id;
  try{localStorage.setItem("ap_levelcheck",JSON.stringify({g:R.g,id:rec.id,scores:R.scores,date:new Date().toLocaleDateString("sv")}));}catch(e){}
  $("v-q").hidden=true;$("v-res").hidden=false;window.scrollTo(0,0);
}
$("r-again").onclick=()=>{$("v-res").hidden=true;$("v-pick").hidden=false;};
</script>

<script>
/* ---- 単語のレベルテスト（2026-11-17 kimi）：?full=1。自分の計画（/start/）の後に通る。
   帳を易しい順に1冊ずつ（中学2年→…→高校発展→目的の帳→ビジネス→試験→専門）。1冊 20問（中学・高校）／8問（それ以外）。
   「もう8割に届かない」と分かった瞬間にそこで終了。その帳が毎日の単語の開始（こちらが決めて出す・選ばせない）。
   できる人はどこまでも進む（ビジネスの先の試験・専門の帳も出す）。正答率×帳の語数で「推定の語数」。
   帳ごと・10問ごとに端末に保存＝途中で閉じても続きから。STU005・STU009 だけ、終わりに Versant の質問。結果は端末（ap_levelcheck・ap_path・ap_vocab）と名簿（vocab）へ。 */
(function(){
if(new URLSearchParams(location.search).get("full")!=="1")return;
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const G=get("ap_goals",{}),TR=get("ap_track",null),SID=String(get("ap_sid","")||"").toUpperCase();
const purpose=G.purpose||"general",PASS=.8,PER=20,PER_X=8;
const GEN=["gen2","gen3","gen4","high1","high2"];   // 高校難関（high3）は出さない（2026-11-17 kimi「難しすぎる」）
const EXAMS={toeic:["toeic700","toeic800","toeic900","toeic950"],ielts:["ielts55","ielts60","ielts65","ielts70","ielts75","ielts80","ielts85"],toefl:["toefl60","toefl70","toefl80","toefl90","toefl100","toefl110"],eiken:["eikenp2","eiken2","eikenp1","eiken1"]};
const ids=g=>APW_COURSES.filter(c=>c.g===g).map(c=>c.id);
const tail=purpose==="business"?["native"].concat(ids("Business")):purpose==="exam"?(EXAMS[G.target]||[]):purpose==="special"&&TR&&TR.words?ids(TR.words):["native"];
const uniq=a=>a.filter((id,i)=>a.indexOf(id)===i&&APW_COURSES.some(c=>c.id===id));
const PATH=uniq(GEN.concat(tail));   // 目的の順番（毎日の単語はこの順）
const REST=uniq(ids("Business").concat(EXAMS.toefl,EXAMS.ielts,EXAMS.toeic,EXAMS.eiken,APW_COURSES.filter(c=>["General","Native","Business","TOEIC","IELTS","TOEFL iBT","英検®"].indexOf(c.g)<0).map(c=>c.id))).filter(id=>PATH.indexOf(id)<0);   // できる人はこの先も（スラングは出さない）
const SEQ=PATH.concat(REST);
const per=id=>GEN.indexOf(id)>=0?PER:PER_X;
const title=id=>{const c=APW_COURSES.filter(x=>x.id===id)[0];return c?(c.g==="General"?"":c.g+" ")+c.t:id;};
document.querySelector("h1.large").textContent="単語のレベルテスト";
document.querySelector("p.sub").textContent="易しい帳から順に。できなくなった所で終わります。知らない単語は「わからない」。途中で閉じても、続きからできます。";
$("v-pick").hidden=true;$("to-words").hidden=true;$("r-again").hidden=true;
let V=get("ap_vtest",null);if(V&&!V.seq)V=null;   // 古い形（全部まとめて出す版）は作り直す
async function deck(){   // 今の帳（SEQ[V.di]）の問題を作る。読めない帳は飛ばす。もう無ければ false
  while(V.di<SEQ.length){
    const id=SEQ[V.di];let C=null;try{C=await load(id);}catch(e){}
    if(C&&C.words&&C.words.length>=5){
      const W=C.words,n=Math.min(per(id),W.length);V.size[id]=W.length;
      V.qs=shuffle(W.map((_,i)=>i)).slice(0,n).map(wi=>{const right=W[wi][1][0][0],others=shuffle(W.filter((_,i)=>i!==wi).map(w=>w[1][0][0]).filter(m=>m!==right)).slice(0,3);return {en:W[wi][0],right,opts:shuffle([right,...others])};});
      V.i=0;put("ap_vtest",V);return true;
    }
    V.skip.push(id);V.di++;
  }
  return false;
}
function ask(){
  const q=V.qs[V.i];
  $("q-level").textContent=title(SEQ[V.di]);$("q-count").textContent=(V.i+1)+" / "+V.qs.length;
  $("q-word").textContent=q.en;speak(q.en);
  $("q-choices").innerHTML=q.opts.map((o,n)=>'<button class="ch"><span class="k">'+(n+1)+'</span><span>'+o.replace(/[&<>]/g,"")+'</span></button>').join("")+'<button class="ch idk" data-idk="1">わからない</button>';
  window.scrollTo(0,0);
}
async function next(){if(await deck()){ask();return;}finish();}
function finish(){
  V.done=true;put("ap_vtest",V);$("v-q").hidden=true;
  if(["STU005","STU009"].indexOf(SID)>=0){$("v-vs").hidden=false;window.scrollTo(0,0);}else result(null);
}
$("q-say").onclick=()=>speak(V.qs[V.i].en);
$("q-choices").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const id=SEQ[V.di],q=V.qs[V.i];V.asked[id]=(V.asked[id]||0)+1;
  if(!b.dataset.idk&&b.lastElementChild.textContent===q.right.replace(/[&<>]/g,""))V.right[id]=(V.right[id]||0)+1;
  V.i++;
  if(V.i%10===0)put("ap_vtest",V);   // 10問ごとに保存（続きから）
  if(V.asked[id]-(V.right[id]||0)>V.qs.length*(1-PASS)+1e-9){finish();return;}   // もう8割に届かない：ここで終わり（この帳が開始）
  if(V.i<V.qs.length){ask();return;}
  V.di++;next();   // 8割を超えた：次の帳へ
};
$("v-vs").onclick=e=>{const b=e.target.closest("[data-vs]");if(!b)return;$("v-vs").hidden=true;result(b.dataset.vs==="1");};
function result(versant){
  const sc={};Object.keys(V.asked).forEach(id=>{sc[id]=Math.round(100*(V.right[id]||0)/V.asked[id])/100;});
  const tested=SEQ.filter(id=>id in sc);
  let est=400;   // 中学1年（gen1）は一覧から外してあるので、知っている物として足す
  tested.forEach(id=>{est+=Math.round(sc[id]*(V.size[id]||0));});est=Math.round(est/100)*100;
  const last=Math.max(PATH.length,tested.length?SEQ.indexOf(tested[tested.length-1])+1:0);
  const path=SEQ.slice(0,last).filter(id=>V.skip.indexOf(id)<0);   // 目的の順番＋進めた分
  const start=tested.filter(id=>sc[id]<PASS)[0]||path[path.length-1];
  const per=+G.words||20;
  document.querySelector("#v-res .say").textContent="あなたの単語力";
  $("r-course").textContent="推定 約"+est.toLocaleString()+"語";
  $("r-msg").textContent="毎日の単語は「"+title(start)+"」の最初から、1日 "+per+"語ずつ進めます。順番はこちらで決めてあります。";
  $("r-levels").innerHTML=tested.map(id=>'<div><span>'+title(id)+'</span><span class="'+(sc[id]>=PASS?"y":"s")+'">'+Math.round(sc[id]*100)+'%</span></div>').join("");   // 赤は使わない（80%未満は灰色）
  $("r-start").href="./?c="+start;$("r-start").textContent="単語を始める";
  const v={scores:sc,est,start,path,at:V.date};if(versant!==null)v.versant=versant;
  put("ap_levelcheck",{g:"General",id:start,scores:[],date:V.date});put("ap_path",path);put("ap_vocab",v);
  try{localStorage.setItem("apush-words-course",start);localStorage.removeItem("ap_vtest");}catch(e){}
  try{window.aps.push(["vocab",v]);}catch(e){}
  $("v-res").hidden=false;window.scrollTo(0,0);
}
(async function(){
  if(V&&V.done){finish();return;}   // 全部答えた後（Versant の画面で閉じた等）：作り直さず結果へ
  if(!V){V={seq:1,di:0,qs:[],i:0,right:{},asked:{},size:{},skip:[],date:new Date().toLocaleDateString("sv")};}
  if(V.qs&&V.qs.length&&V.i<V.qs.length){$("v-q").hidden=false;ask();return;}   // 途中から
  if(V.qs&&V.qs.length)V.di++;   // 帳の最後まで答えてから閉じた：次の帳から
  if(!(await deck())){if(Object.keys(V.asked).length){finish();}else location.replace("./");return;}   // 帳が1つも読めない：単語のページへ（止まらない）
  $("v-q").hidden=false;ask();
})();
})();
</script>
<script src="/ui.js" defer></script>
