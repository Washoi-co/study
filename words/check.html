<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F8">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>単語のレベルチェック｜A-PUSH</title>
<script>/* 生徒用：ログインしていなければトップへ */try{if(!JSON.parse(localStorage.getItem("ap_pass")))location.replace("/");}catch(e){location.replace("/");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/ui.css">
<style>
/* 単語のレベルチェック（見た目は /ui.css＝ほかのページと同じ。ここは足りない分だけ）
   種類（General/TOEIC/IELTS/TOEFL）を選び、やさしいレベルから6問ずつ。5問以上わかれば次のレベルへ。わからなかったレベルを、おすすめのコースにする。 */
.en{font-family:var(--en)}
.tracks{display:flex;flex-direction:column;gap:9px}
.tracks .row{grid-template-columns:1fr auto}
.tracks .go{color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.word{margin:0;font-family:var(--en);font-size:clamp(30px,8vw,40px);font-weight:900;letter-spacing:-.02em;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.say{align-self:center;background:var(--soft);color:var(--brand);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.ch.idk{background:transparent;box-shadow:0 0 0 1px var(--line2) inset;color:var(--mute);font-weight:500;justify-content:center}
.rc{margin:0;text-align:center;font-family:var(--fd);font-size:clamp(24px,6.5vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1.3;color:var(--brand)}
.lv{display:flex;flex-direction:column}
.lv div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:.5px solid var(--line2);font-size:14px}
.lv div:last-child{border-bottom:0}
.lv .y{color:var(--ok);font-weight:700}.lv .n{color:var(--ng);font-weight:700}.lv .s{color:var(--mute)}
.acts a{text-align:center;text-decoration:none}
.foot{font-size:12px;color:var(--mute);line-height:1.7;margin:4px 2px 0}
</style>
</head>
<body data-tab="wd">
<main class="screen">
  <div class="nav"><span class="navl"><span class="mini">単語</span></span><span class="navr"><a class="pill press" href="./" id="to-words" hidden>単語へ</a></span></div>
  <h1 class="large">レベルチェック</h1>
  <p class="sub">3〜5分。やさしいレベルから順に出ます。知らない単語は「わからない」を押してください。当てずっぽうより、正しいレベルが出ます。</p>

  <section class="card" id="v-pick"><div class="cin">
    <p class="say" style="align-self:stretch;background:none;color:var(--mute);font-weight:500;text-align:left;padding:0">どの目的で単語を覚えますか？</p>
    <div class="tracks" id="tracks"></div>
  </div></section>

  <section class="card" id="v-q" hidden><div class="cin">
    <div class="meta"><span id="q-level"></span><span id="q-count"></span></div>
    <p class="word" id="q-word"></p>
    <button class="say" id="q-say">🔊 発音を聞く</button>
    <div class="choices" id="q-choices"></div>
  </div></section>

  <section class="card" id="v-res" hidden><div class="cin">
    <p class="say" style="padding:0;background:none">あなたにおすすめのコース</p>
    <p class="rc" id="r-course"></p>
    <p class="say" style="padding:0;background:none;font-weight:500;color:var(--mute)" id="r-msg"></p>
    <div class="lv" id="r-levels"></div>
    <div class="acts"><a class="primary" id="r-start" href="#">このコースで始める</a></div>
    <div class="acts"><button class="ghost" id="r-again">ほかの目的でもチェックする</button></div>
  </div></section>

  <p class="foot">目安のチェックです。始めてみて、やさしすぎる・難しすぎると感じたら、単語ページの上のメニューでいつでもコースを変えられます。</p>
</main>

<script src="/activity.js"></script>
<script src="courses/index.js"></script>
<script>
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function speak(t){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const PER=6, PASS=5;  // 1レベル6問、5問以上で次へ
const TRACKS=[
  {g:"General",d:"中学〜高校の基本。日常会話の土台"},
  {g:"TOEIC",d:"仕事・ビジネスの英語"},
  {g:"IELTS",d:"留学・移住。アカデミックな英語"},
  {g:"TOEFL iBT",d:"アメリカなどへの留学"},
];
try{if(localStorage.getItem("apush-words-course"))$("to-words").hidden=false;}catch(e){}

$("tracks").innerHTML=TRACKS.map((t,i)=>{
  const lv=APW_COURSES.filter(c=>c.g===t.g);
  return '<button class="row" data-i="'+i+'"><span><b>'+t.g+'</b><small>'+t.d+'（'+lv[0].t+'〜'+lv[lv.length-1].t+'）</small></span><span class="go">チェック ›</span></button>';
}).join("");
$("tracks").onclick=e=>{const b=e.target.closest("[data-i]");if(b)start(TRACKS[+b.dataset.i].g);};

// コースのファイルは1つずつ読み込む（どれも window.APW_COURSE に入るので）
const loaded={};
function load(id){
  if(loaded[id])return Promise.resolve(loaded[id]);
  return new Promise((ok,ng)=>{const s=document.createElement("script");s.src="courses/"+id+".js";
    s.onload=()=>{loaded[id]=window.APW_COURSE;ok(loaded[id]);};s.onerror=ng;document.head.appendChild(s);});
}

let R=null;  // {g, levels, li, qs, qi, right, scores}
async function start(g){
  R={g,levels:APW_COURSES.filter(c=>c.g===g),li:0,scores:[]};
  await level();
}
async function level(){
  const lv=R.levels[R.li],C=await load(lv.id),W=C.words;
  R.qs=shuffle(W.map((_,i)=>i)).slice(0,PER).map(wi=>{
    const right=W[wi][1][0][0];
    const others=shuffle(W.filter((_,i)=>i!==wi).map(w=>w[1][0][0]).filter(m=>m!==right)).slice(0,3);
    return {en:W[wi][0],right,opts:shuffle([right,...others])};
  });
  R.qi=0;R.right=0;
  ["v-pick","v-res"].forEach(v=>$(v).hidden=true);$("v-q").hidden=false;
  ask();
}
function ask(){
  const q=R.qs[R.qi],lv=R.levels[R.li];
  $("q-level").textContent=R.g+" "+lv.t+"（"+(R.li+1)+" / "+R.levels.length+" レベル）";
  $("q-count").textContent=(R.qi+1)+" / "+PER;
  $("q-word").textContent=q.en;speak(q.en);
  $("q-choices").innerHTML=q.opts.map((o,n)=>'<button class="ch"><span class="k">'+(n+1)+'</span><span>'+o.replace(/[&<>]/g,"")+'</span></button>').join("")+'<button class="ch idk" data-idk="1">わからない</button>';
  window.scrollTo(0,0);
}
$("q-say").onclick=()=>speak(R.qs[R.qi].en);
$("q-choices").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(!b.dataset.idk&&b.lastElementChild.textContent===R.qs[R.qi].right.replace(/[&<>]/g,""))R.right++;
  if(R.qi<PER-1){R.qi++;ask();return;}
  R.scores.push(R.right);
  // 5問以上わかったら次のレベル。わからなかったレベルがおすすめ
  if(R.right>=PASS&&R.li<R.levels.length-1){R.li++;level();return;}
  result();
};
function result(){
  const passedAll=R.right>=PASS, rec=R.levels[R.li];
  $("r-course").textContent=rec.g+" "+rec.t;
  $("r-msg").textContent=passedAll?"いちばん上のレベルまで、ほとんどわかりました。このコースで仕上げましょう。"
    :R.li===0?"まずはこのレベルから。知らない単語を、絵と声で毎日覚えていきましょう。"
    :"ひとつ下のレベルはほとんどわかりました。このレベルから始めると、ちょうどいい難しさです。";
  $("r-levels").innerHTML=R.levels.map((l,i)=>{
    const s=R.scores[i];
    return '<div><span>'+l.g+" "+l.t+'</span>'+(s==null?'<span class="s">—</span>':'<span class="'+(s>=PASS?"y":"n")+'">'+s+" / "+PER+'</span>')+'</div>';
  }).join("");
  $("r-start").href="./?c="+rec.id;
  try{localStorage.setItem("ap_levelcheck",JSON.stringify({g:R.g,id:rec.id,scores:R.scores,date:new Date().toLocaleDateString("sv")}));}catch(e){}
  $("v-q").hidden=true;$("v-res").hidden=false;window.scrollTo(0,0);
}
$("r-again").onclick=()=>{$("v-res").hidden=true;$("v-pick").hidden=false;};
</script>
<script src="/ui.js" defer></script>
</body>
</html>
