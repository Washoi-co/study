<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A-PUSH">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>シャドーイング｜A-PUSH</title>
<script src="/activity.js"></script>
<script>/* 生徒用：ログインしていなければトップへ */try{if(!JSON.parse(localStorage.getItem("ap_pass")))location.replace("/");}catch(e){location.replace("/");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/ui.css">
<style>
/* シャドーイングだけの見た目（共通は /ui.css） */
#home,#lesson{display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start;font-size:14px;font-weight:600;color:var(--brand);text-decoration:none;margin:0 2px}
h2{font-size:16px;font-weight:700;margin:0 0 6px}
.stepbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px}
.stepbar b{font-size:17px;font-weight:700;line-height:1.35}
.stepbar span{font-family:var(--en);font-size:13px;font-weight:700;color:var(--brand);white-space:nowrap}
.player{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}
.player video{display:block;width:100%;height:100%}
.cover{position:absolute;left:0;right:0;bottom:0;background:#000;pointer-events:none}
.subt{min-height:3.4em;padding:10px 14px;background:var(--dark);color:#fff;border-radius:14px;font-size:15px;line-height:1.45}
.subt .e{font-family:var(--en);font-weight:500}
.subt .j{font-size:13px;opacity:.8;margin-top:2px}
.pbar{display:flex;align-items:center;gap:10px}
.pbar button{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--on);font-size:16px;flex:none}
.pbar input{flex:1;accent-color:var(--brand)}
.pbar span{font-family:var(--en);font-size:13px;color:var(--mute);min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.ctrls{display:grid;gap:8px}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crow>span{font-size:12px;color:var(--mute);width:3.2em}
.crow .pill{font-size:13px;padding:6px 12px}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--on)}
.card{padding:16px 16px 18px}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;background:var(--brand);color:var(--on);font-weight:700;text-decoration:none;margin-top:12px;transition:transform .1s ease-out}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.pct{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pct button{background:var(--soft);color:var(--brand);border-radius:10px;padding:10px 0;font-family:var(--en);font-weight:900}
.pct button[aria-pressed="true"]{background:var(--brand);color:var(--on)}
.script{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none;max-height:340px;overflow:auto}
.script li{border-bottom:.5px solid var(--line2);padding-bottom:6px}
.script .e{font-family:var(--en);font-size:15px}
.script .j{font-size:13px;color:var(--mute)}
.vocab{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-top:6px}
.vocab b{font-family:var(--en)}
.tip{font-size:14px;color:var(--mute);margin:8px 0 0}
.q{margin-top:14px}
.q p{margin:0 0 6px;font-weight:700;font-size:15px}
.q button{display:block;width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:14.5px;border:1.5px solid transparent}
.q button.ok{border-color:var(--ok);background:#E9F6EF}
.q button.ng{border-color:var(--ng);background:#FCECEA}
.q .ex{font-size:13px;color:var(--mute);margin-top:5px}
.compare{display:flex;justify-content:center;gap:18px;align-items:baseline;margin:10px 0}
.compare div{text-align:center}
.compare b{display:block;font-family:var(--en);font-size:40px;font-weight:900;line-height:1}
.compare span{font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:420px;margin:0}
</style>
</head>
<body data-tab="sh">
<main class="screen">
  <div class="nav"><span class="navl"><span class="mini">シャドーイング</span></span><button class="pill" id="howto">やり方</button></div>

  <!-- 一覧 -->
  <section id="home">
    <h1 class="large">シャドーイング</h1>
    <div class="shl" id="sh-list"></div>
  </section>

  <!-- 練習 -->
  <section id="lesson" hidden>
    <a class="back" href="#">← 動画の一覧</a>
    <div class="stepbar"><b id="stitle"></b><span id="snum"></span></div>
    <div class="player">
      <video id="v" playsinline webkit-playsinline preload="metadata" disablepictureinpicture></video>
      <div class="cover" id="cover" hidden></div>
    </div>
    <div class="subt" id="sub" hidden><div class="e" id="se"></div><div class="j" id="sj"></div></div>
    <div class="pbar"><button id="pp" aria-label="再生">▶</button><input id="seek" type="range" min="0" step="0.1" value="0" aria-label="再生位置"><span id="tm">0:00</span></div>
    <div class="ctrls">
      <div class="crow"><span>字幕</span>
        <button class="pill" data-subs="en">英</button><button class="pill" data-subs="both">英＋日</button><button class="pill" data-subs="off">なし</button></div>
      <div class="crow"><span>速さ</span>
        <button class="pill" data-rate="0.75">0.75</button><button class="pill" data-rate="0.9">0.9</button><button class="pill" data-rate="1">1.0</button></div>
      <div class="crow" id="rep"></div>
    </div>
    <div class="card" id="panel"></div>
    <p class="credit" id="credit"></p>
  </section>

  <div class="foot">
    <span id="credits"></span>
    <span>英検®は公益財団法人 日本英語検定協会の登録商標です。本教材は同協会の承認を受けたものではありません。</span>
    <span>進み具合や結果はこの端末の中だけに保存し、どこにも送りません。</span>
  </div>
</main>

<div class="modal" id="intro" hidden>
  <div class="card">
    <div class="imgs"><img src="/howto/11.webp" alt="頭に余裕ができると、意味が入る。" width="1600" height="900" loading="lazy"><img src="/howto/06.webp" alt="分からなくても、真似て言い続ける。" width="1600" height="900" loading="lazy"></div><p class="imgs-n">← 横にスワイプ →</p>
    <h2>なぜシャドーイング？</h2>
    <p style="font-size:13.5px;margin:0">知っている単語でも、音がつながると別の音に聞こえます（I am →「アム」）。まず3回聞いて、耳を慣らします。そのあと質問に答えて、意味が取れたか確かめます。</p>
    <button class="btn" id="introOk">はじめる</button>
  </div>
</div>

<script>
const LEVELS = {1: "英検®4級程度", 2: "英検®3級程度", 3: "英検®2級〜準1級程度"};
const STEPS = [   /* 2026-10-18：2つだけ。① 3回聞く → ② 質問に答える */
  {t: "3回聞く", subs: "off", listen: true, tip: "最後まで聞くと、1回に数えます。字幕と速さは下で変えられます。"},
  {t: "質問に答える", quiz: true},
];
const TIMES = 3;
const $ = s => document.querySelector(s);
const v = $("#v");
let DB, L, step = 0, subs = "off", stopAt = null, loopSeg = null;

const store = {
  get() { try { return JSON.parse(localStorage.getItem("shadowing:v1")) || {}; } catch (e) { return {}; } },
  set(f) { try { const s = store.get(); f(s); localStorage.setItem("shadowing:v1", JSON.stringify(s)); } catch (e) {} },
};
const prog = id => store.get()[id] || {};
const setProg = (id, k, val) => store.set(s => { s[id] = Object.assign(s[id] || {}, {[k]: val}); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

fetch("data/lessons.json").then(r => r.json()).then(d => {
  DB = d; DB.lessons = DB.lessons.filter(x => x.active);
  $("#credits").textContent = [...new Set(DB.lessons.map(x => x.credit))].join(" / ");
  route(); window.onhashchange = route;
  function route() { const id = location.hash.slice(1); const x = DB.lessons.find(l => l.id === id); x ? open(x) : home(); }
  if (!store.get().intro) $("#intro").hidden = false;
});
$("#howto").onclick = () => { $("#intro").hidden = false; };
$("#introOk").onclick = () => { $("#intro").hidden = true; store.set(s => s.intro = 1); };

function home() {
  v.pause(); $("#lesson").hidden = true; $("#home").hidden = false;
  $("#sh-list").innerHTML = [1, 2, 3].map(lv => `<h3>レベル${lv}<span>${LEVELS[lv]}</span></h3>` + DB.lessons.filter(x => x.level === lv).map((x, i) => {
    const p = prog(x.id), mins = Math.round((x.lines.at(-1).end - x.lines[0].start) / 60 * 10) / 10;
    return `<a class="vid" data-id="${x.id}" href="#${x.id}"><span class="id">${i + 1}</span><span class="t">${esc(x.title)}<small>${x.source === "nasa" ? "NASA" : x.source === "apush" ? "A-PUSH講師" : "VOA"} ・ 約${mins}分${p.done ? "" : p.step ? ` ・ ${p.step + 1} / 2` : ""}</small></span><span class="go">${p.done ? "✓ 完了" : "開く →"}</span></a>`;
  }).join("")).join("");
}

function open(x) {
  L = x; $("#home").hidden = true; $("#lesson").hidden = false;
  v.src = L.video; $("#credit").textContent = L.credit;
  const rep = $("#rep");
  if (L.repeat === "minute") {
    const n = Math.ceil((L.lines.at(-1).end) / 60);
    rep.innerHTML = `<span>区間</span><button class="pill" data-seg="-1" aria-pressed="true">全部</button>` +
      Array.from({length: n}, (_, i) => `<button class="pill" data-seg="${i}">${i}〜${i + 1}分</button>`).join("");
  } else rep.innerHTML = `<span>練習</span><button class="pill" id="again">↺ この文をもう一回</button>`;
  go(Math.min(prog(L.id).step || 0, 1)); window.scrollTo(0, 0);
}

function go(n) {
  step = n; setProg(L.id, "step", n); const S = STEPS[n];
  $("#stitle").textContent = `${L.title}`; $("#snum").textContent = `${n + 1} / 2 ・ ${S.t}`;
  if (S.subs) setSubs(S.subs);
  const p = prog(L.id), heard = Math.min(p.heard || 0, TIMES);
  let h = `<h2>${n + 1}. ${S.t}</h2>` + (S.tip ? `<p class="tip">${S.tip}</p>` : "");
  if (n === 0 && L.synopsis) h += `<p class="tip"><b>ここまでのあらすじ：</b>${esc(L.synopsis)}</p>`;
  if (S.listen) {
    h += `<div class="dots" id="heard">${[0, 1, 2].map(i => `<button class="dot${i < heard ? " on" : ""}" data-h="${i}" aria-label="${i + 1}回目">${i + 1}</button>`).join("")}</div>`;
    h += `<button class="btn" id="next" ${heard < TIMES ? "disabled" : ""}>質問に答える →</button>`;
  }
  if (S.quiz) h += quiz();
  if (n > 0) h += `<button class="btn ghost" id="prev">← もう一度聞く</button>`;
  $("#panel").innerHTML = h;
  const nx = $("#next"); if (nx) nx.onclick = () => { go(n + 1); $("#lesson").scrollIntoView(); };
  const pv = $("#prev"); if (pv) pv.onclick = () => { setProg(L.id, "heard", 0); go(0); };
  const hd = $("#heard"); if (hd) hd.onclick = e => { const b = e.target.closest("[data-h]"); if (b && +b.dataset.h <= heard) { setProg(L.id, "heard", Math.max(heard, +b.dataset.h + 1)); go(0); } };
}
/* 最後まで聞いたら1回に数える（3回まで） */
v.addEventListener("ended", () => { if (L && STEPS[step].listen) { const k = prog(L.id).heard || 0; if (k < TIMES) { setProg(L.id, "heard", k + 1); go(0); } } });


function quiz() {
  const res = prog(L.id).quiz || [];
  let h = L.quiz.map((q, i) => `<div class="q" data-q="${i}"><p>Q${i + 1}. ${esc(q.q)}</p>${q.choices.map((c, j) => {
    const cls = res[i] == null ? "" : j === q.answer ? "ok" : j === res[i] ? "ng" : "";
    return `<button class="${cls}" data-c="${j}" ${res[i] != null ? "disabled" : ""}>${esc(c)}</button>`;
  }).join("")}${res[i] != null ? `<div class="ex">${res[i] === q.answer ? "⭕ 正解。" : "✕ "}${esc(q.explain)}</div>` : ""}</div>`).join("");
  if (res.filter(x => x != null).length === L.quiz.length) {
    const ok = L.quiz.filter((q, i) => res[i] === q.answer).length;
    setProg(L.id, "done", 1);
    const td = new Date().toDateString();  // 同じ動画でも、日が変われば「今日の1本」に数える（画面を描き直しても1日1回）
    if (prog(L.id).doneOn !== td) { apMark("shadow"); setProg(L.id, "doneOn", td); }
    const all = DB.lessons, k = all.indexOf(L), nxt = all[k + 1];
    h += `<div class="card" style="background:var(--bg)"><h2>おつかれさまでした</h2><p class="tip">クイズ ${ok} / ${L.quiz.length} 問正解</p>
      ${nxt ? `<a class="btn" href="#${nxt.id}">次の動画へ：${esc(nxt.title)}</a>` : ""}</div>`;
  }
  setTimeout(() => document.querySelectorAll(".q").forEach(d => d.onclick = e => {
    const b = e.target.closest("button[data-c]"); if (!b || b.disabled) return;
    const r = prog(L.id).quiz || []; r[+d.dataset.q] = +b.dataset.c; setProg(L.id, "quiz", r); go(1);
  }));
  return h;
}

/* ---- プレーヤー ---- */
function setSubs(m) {
  subs = m;
  document.querySelectorAll("[data-subs]").forEach(b => b.setAttribute("aria-pressed", b.dataset.subs === m));
  const off = m === "off";
  $("#cover").hidden = !(off && L.cover_height > 0); $("#cover").style.height = (L.cover_height * 100) + "%";
  $("#sub").hidden = off;
  if (L.audio_only) { // 文字だけの動画：字幕なしの段は音声＋静止画に替える
    const want = off ? L.audio_only : L.video;
    if (!v.src.endsWith(want)) { const t = v.currentTime, play = !v.paused, r = v.playbackRate; v.src = want; v.addEventListener("loadedmetadata", () => { v.currentTime = t; v.playbackRate = r; if (play) v.play(); }, {once: true}); }
  }
  tick();
}
function setRate(r) { v.playbackRate = r; v.defaultPlaybackRate = r; document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.rate === r)); }
document.querySelectorAll("[data-subs]").forEach(b => b.onclick = () => setSubs(b.dataset.subs));
document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => setRate(+b.dataset.rate));

const curLine = () => { const t = v.currentTime; let k = -1; L.lines.forEach((l, i) => { if (l.start <= t + 0.05) k = i; }); return k; };
function seekLine(i) { v.currentTime = L.lines[i].start; stopAt = L.lines[i].end; v.play(); }
$("#rep").onclick = e => {
  if (e.target.id === "again") { const k = curLine(); if (k >= 0) seekLine(k); return; }
  const b = e.target.closest("[data-seg]"); if (!b) return;
  const s = +b.dataset.seg; loopSeg = s < 0 ? null : s;
  document.querySelectorAll("[data-seg]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (loopSeg != null) { v.currentTime = loopSeg * 60; v.play(); }
};
function tick() {
  if (!L) return;
  const t = v.currentTime;
  if (stopAt != null && t >= stopAt) { v.pause(); stopAt = null; }
  if (loopSeg != null && (t >= (loopSeg + 1) * 60 || t >= v.duration - 0.2)) v.currentTime = loopSeg * 60;
  const l = L.lines.find(x => x.start <= t && t <= x.end + 0.3);
  $("#se").textContent = l ? l.en : ""; $("#sj").textContent = l && subs === "both" ? l.ja : "";
}
v.addEventListener("timeupdate", tick);
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
$("#pp").onclick = () => v.paused ? v.play() : v.pause();
v.addEventListener("play", () => $("#pp").textContent = "❚❚");
v.addEventListener("pause", () => $("#pp").textContent = "▶");
v.addEventListener("loadedmetadata", () => $("#seek").max = v.duration);
v.addEventListener("timeupdate", () => { $("#seek").value = v.currentTime; $("#tm").textContent = `${fmt(v.currentTime)} / ${fmt(v.duration || 0)}`; });
$("#seek").oninput = e => { v.currentTime = +e.target.value; };
v.onclick = () => $("#pp").click();
v.addEventListener("seeking", () => { if (stopAt != null && (v.currentTime < stopAt - 30 || v.currentTime > stopAt)) stopAt = null; });
</script>
<script src="/install.js" defer></script>  <!-- ホーム画面に追加の案内・LINEから来た人・記録の引き継ぎ（2026-10-16） -->
<script src="/ui.js" defer></script>
</body>
</html>
