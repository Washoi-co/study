<style>
/* 模擬テストの共通エンジン（2026-11-03）。問題は /exam/<id>.json（平文）。採点は kanri の assess（ライティング・スピーキング）。
   セクションの型：listening（読み上げ＋設問）・reading（文章＋設問）・writing（1題・時間つき）・speaking（録音3タスク） */
.timer{display:flex;justify-content:space-between;align-items:center;font-family:var(--en);font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px;margin:0 2px}
.timer b{color:var(--ink);font-size:18px}.timer.low b{color:var(--brand)}
.passage{font-family:var(--en);font-size:16px;line-height:1.65;white-space:pre-line;max-height:46vh;overflow:auto;padding:14px 16px;background:var(--soft);border-radius:14px}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .n{font-family:var(--en);font-weight:900;color:var(--brand);font-size:13px}
.q .stem{font-family:var(--en);font-size:15.5px;line-height:1.5;margin:0}
.q .ja{font-size:12.5px;color:var(--mute);margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.4;font-family:var(--en);color:var(--ink);display:flex;gap:10px}
.opts button b{font-family:var(--en);color:var(--brand);min-width:16px}
.opts button[aria-pressed="true"]{background:var(--brand);color:var(--on)}.opts button[aria-pressed="true"] b{color:var(--on)}
.opts button.ok{outline:2px solid var(--ok)}.opts button.ng{opacity:.5}
.gap{width:100%;font-size:16px;font-family:var(--en);padding:10px 12px;border-radius:10px;background:var(--soft);border:0}
.gap.ok{outline:2px solid var(--ok)}.gap.ng{outline:2px solid var(--brand)}
.ans{font-size:12.5px;color:var(--mute)}
textarea.essay{width:100%;min-height:200px;font-size:16px;line-height:1.55;font-family:var(--en);padding:12px;border-radius:14px;background:var(--soft);border:0;resize:vertical}
.wc{font-family:var(--en);font-size:13px;color:var(--mute);text-align:right}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
.rec .mic{width:96px;height:96px;border-radius:50%;background:var(--brand);color:var(--on);font-size:34px;display:grid;place-items:center;transition:transform .15s}
.rec .mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.rec small{color:var(--mute);font-size:13px}
.res{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px;background:var(--soft);border-radius:14px}
.res b{font-family:var(--en);font-weight:900;font-size:30px;letter-spacing:-.02em;line-height:1}
.res small{display:block;color:var(--mute);font-size:12.5px}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.crit b{font-family:var(--en)}
.ded{margin:0;padding-left:1.2em;font-size:13.5px;line-height:1.5}
.ded li{margin:4px 0}.ded i{color:var(--mute);font-style:normal}
.corr{font-family:var(--en);font-size:14.5px;line-height:1.55;background:var(--soft);border-radius:12px;padding:12px}
.ok-t{color:var(--ok);font-weight:700}
.note{font-size:12.5px;color:var(--mute)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SITE=window.SITE||{}, ID=new URLSearchParams(location.search).get("id")||((SITE.exams||[])[0]||{}).id;
let X=null;            // テストの定義
let I=0;               // 今のセクション
const A={};            // 答え  A[secId]={...}
const R={};            // 結果  R[secId]={...}
let timer=null, endAt=0;
const store={get(){try{return JSON.parse(localStorage.getItem("exam:v1"))||{};}catch(e){return{};}},set(f){try{const s=store.get();f(s);localStorage.setItem("exam:v1",JSON.stringify(s));}catch(e){}}};
function view(k){["start","sec","result"].forEach(n=>{$("v-"+n).hidden=n!==k;});window.scrollTo(0,0);}
const fmtBand=(v,sc)=>sc&&sc.step>=1?String(v):(Number(v).toFixed(1));

/* ---------- 読み込み ---------- */
fetch("/exam/"+encodeURIComponent(ID||"")+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>{X=x;paintStart();}).catch(()=>{
  $("x-title").textContent="テストが見つかりません";$("x-sub").textContent="「戻る」から選び直してください。";});

function paintStart(){
  $("x-exam").textContent=X.examName||X.exam.toUpperCase();$("x-title").textContent=X.title;$("x-sub").textContent="約"+X.minutes+"分 ・ "+X.sections.length+"パート";
  $("s-note").textContent=X.note||"";
  $("s-parts").innerHTML=X.sections.map(s=>'<div class="li"><span>'+esc(s.title)+'<br><small class="note">'+esc(s.desc||"")+'</small></span><span class="e">'+(s.minutes?"約"+s.minutes+"分":"")+'</span></div>').join("");
  const last=store.get()[X.id];
  if(last&&last.R){$("s-last").hidden=false;$("s-lastnote").textContent="前回："+last.at.slice(0,10)+"　総合の目安 "+fmtBand(last.overall,X.scale);$("s-show").onclick=()=>{Object.assign(R,last.R);showResult(false);};}
  view("start");
}
$("s-go").onclick=()=>{I=0;Object.keys(A).forEach(k=>delete A[k]);Object.keys(R).forEach(k=>delete R[k]);openSec();};
$("r-again").onclick=()=>paintStart();

/* ---------- セクション ---------- */
function openSec(){
  const S=X.sections[I]; if(!S){showResult(true);return;}
  $("t-name").textContent=S.title+(S.minutes?"　制限 "+S.minutes+"分":"");
  $("sec-next").textContent=I===X.sections.length-1?"終わって結果を見る":"次のパートへ";
  $("sec-next").disabled=false;
  A[S.id]=A[S.id]||{};
  ({listening:paintLR,reading:paintLR,writing:paintWriting,speaking:paintSpeaking}[S.kind])(S);
  view("sec");
  startTimer(S.minutes?S.minutes*60:0,()=>finishSec(true));
}
function startTimer(sec,onEnd){
  clearInterval(timer);$("t-bar").hidden=!sec;$("t-fill").parentNode.hidden=!sec;if(!sec)return;
  endAt=Date.now()+sec*1000;
  const tick=()=>{const left=Math.max(0,Math.round((endAt-Date.now())/1000));$("t-left").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
    $("t-fill").style.width=(left/sec*100)+"%";$("t-bar").classList.toggle("low",left<=60);if(left<=0){clearInterval(timer);onEnd();}};
  tick();timer=setInterval(tick,500);
}
$("sec-next").onclick=()=>finishSec(false);
let finishing=false;
async function finishSec(byTime){
  if(finishing)return;finishing=true;clearInterval(timer);try{speechSynthesis.cancel();}catch(e){}
  const S=X.sections[I];
  try{
    if(S.kind==="listening"||S.kind==="reading")gradeLR(S);
    else if(S.kind==="writing")await gradeWriting(S);
    else if(S.kind==="speaking")await gradeSpeaking(S);
  }finally{finishing=false;}
  I++;openSec();
}

/* ---------- Listening / Reading ---------- */
function paintLR(S){
  const b=$("sec-body");
  let h="";
  if(S.kind==="listening"){
    h+='<p class="tip">'+esc(S.intro||"音声は1回だけ流れます。聞きながら答えてください。")+'</p>';
    h+='<div class="acts"><button class="primary" id="l-play">▶ 音声を流す</button><button class="ghost" id="l-again" hidden>もう一度（本番は1回）</button></div>';
  }else{
    if(S.intro)h+='<p class="tip">'+esc(S.intro)+'</p>';
    h+='<div class="passage">'+esc(S.passage)+'</div>';
  }
  h+='<div id="qs">'+S.questions.map((q,n)=>qHtml(q,n,S)).join("")+'</div>';
  b.innerHTML=h;
  S.questions.forEach((q,n)=>bindQ(q,n,S));
  if(S.kind==="listening"){
    const play=()=>{speakAll(S.script,S.voice||"en-GB");$("l-play").disabled=true;$("l-play").textContent="▶ 再生中…";$("l-again").hidden=false;};
    $("l-play").onclick=play;$("l-again").onclick=()=>{try{speechSynthesis.cancel();}catch(e){}speakAll(S.script,S.voice||"en-GB");};
  }
}
function qHtml(q,n,S){
  const num=(S.start||1)+n;
  let body="";
  if(q.type==="gap")body='<input class="gap" data-q="'+n+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(q.limit||"ONE WORD")+'">';
  else if(q.type==="tfng")body='<div class="opts" data-q="'+n+'">'+["TRUE","FALSE","NOT GIVEN"].map((o,i)=>'<button type="button" data-i="'+i+'" aria-pressed="false"><b></b>'+o+'</button>').join("")+'</div>';
  else body='<div class="opts" data-q="'+n+'">'+q.choices.map((o,i)=>'<button type="button" data-i="'+i+'" aria-pressed="false"><b>'+"ABCDEFGH"[i]+'</b><span>'+esc(o)+'</span></button>').join("")+'</div>';
  return '<div class="q"><span class="n">'+num+(q.type==="multi"?"　（"+q.pick+"つ選ぶ）":"")+'</span><p class="stem">'+esc(q.q)+'</p>'+(q.ja?'<p class="ja">'+esc(q.ja)+'</p>':"")+body+'</div>';
}
function bindQ(q,n,S){
  const a=A[S.id];
  if(q.type==="gap"){const el=document.querySelector('.gap[data-q="'+n+'"]');el.oninput=()=>{a[n]=el.value.trim();};return;}
  const box=document.querySelector('.opts[data-q="'+n+'"]');
  box.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{
    const i=+bt.dataset.i;
    if(q.type==="multi"){a[n]=a[n]||[];const k=a[n].indexOf(i);if(k>=0)a[n].splice(k,1);else if(a[n].length<q.pick)a[n].push(i);
      box.querySelectorAll("button").forEach(b2=>b2.setAttribute("aria-pressed",String(a[n].indexOf(+b2.dataset.i)>=0)));}
    else{a[n]=i;box.querySelectorAll("button").forEach(b2=>b2.setAttribute("aria-pressed",String(b2===bt)));}
  });
}
const norm=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,"").trim().replace(/\s+/g," ");
function isRight(q,ans){
  if(q.type==="gap")return (q.answer||[]).some(x=>norm(x)===norm(ans));
  if(q.type==="tfng")return ["TRUE","FALSE","NOT GIVEN"][ans]===q.answer;
  if(q.type==="multi")return Array.isArray(ans)&&ans.length===q.pick&&q.answers.every(x=>ans.indexOf(x)>=0);
  return ans===q.answer;
}
function gradeLR(S){
  const a=A[S.id]; let ok=0;
  const detail=S.questions.map((q,n)=>{const r=isRight(q,a[n]);if(r)ok++;return {n:(S.start||1)+n,ok:r,ans:a[n],key:q.type==="gap"?q.answer[0]:q.type==="tfng"?q.answer:q.type==="multi"?q.answers.map(i=>"ABCDEFGH"[i]).join(", "):"ABCDEFGH"[q.answer],why:q.why||""};});
  const bands=X.bands&&X.bands[S.id];
  R[S.id]={kind:S.kind,title:S.title,ok,total:S.questions.length,band:bands?bands[Math.min(ok,bands.length-1)]:null,detail};
}
/* 読み上げ：文ごとに区切って順に。声は lang に合う物があればそれ */
function speakAll(text,lang){
  if(!("speechSynthesis" in window)){alert("この端末では読み上げができません。");return;}
  const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang===lang)||vs.find(x=>x.lang.indexOf(lang.slice(0,2))===0);
  String(text).split(/(?<=[.!?])\s+/).forEach(s=>{const u=new SpeechSynthesisUtterance(s);u.lang=lang;u.rate=.95;if(v)u.voice=v;speechSynthesis.speak(u);});
}
try{speechSynthesis.getVoices();}catch(e){}

/* ---------- Writing ---------- */
const pick=(arr,seed)=>arr[(seed||0)%arr.length];
const seed=Math.floor(Date.now()/864e5);   // 日ごとに違うお題
function paintWriting(S){
  const t=S.task=pick(S.tasks,seed+I);
  $("sec-body").innerHTML='<p class="tip">'+esc(S.intro||"")+'</p><p class="stem" style="font-family:var(--en);font-size:16px;line-height:1.5;margin:0"><b>'+esc(t.type||"")+'</b><br>'+esc(t.prompt)+'</p>'+
    (t.minWords?'<p class="note">目安 '+t.minWords+'〜'+t.maxWords+' 語。'+(t.note||"")+'</p>':"")+
    '<textarea class="essay" id="w-text" placeholder="Write here in English…" autocapitalize="sentences"></textarea><div class="wc" id="w-wc">0 words</div>';
  const ta=$("w-text");ta.oninput=()=>{$("w-wc").textContent=words(ta.value)+" words";A[S.id].text=ta.value;};
}
const words=t=>String(t||"").trim().split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).length;
async function gradeWriting(S){
  const text=(A[S.id].text||"").trim();
  if(!text){R[S.id]={kind:"writing",title:S.title,skipped:true};return;}
  busy("採点しています…");
  try{const res=await window.APushSync.call("assess",{kind:"writing",exam:X.exam,task:S.task,text});R[S.id]=Object.assign({kind:"writing",title:S.title,text,task:S.task},res.data);}
  catch(e){R[S.id]={kind:"writing",title:S.title,text,task:S.task,err:errJa(e)};}
}
const errJa=e=>(e&&/^functions\//.test(e.code||"")&&e.code!=="functions/internal"&&e.message)||"採点できませんでした。電波の良い所でもう一度お試しください。";
function busy(msg){$("sec-body").innerHTML='<p class="say"><span class="spin"></span>'+esc(msg)+'</p>';$("sec-next").disabled=true;}

/* ---------- Speaking：3タスクを順に録音 → 採点 ---------- */
let rec=null,recStream=null,recTick=null,recT=0;
function paintSpeaking(S){
  const set=S.set=pick(S.sets,seed+I); A[S.id].clips=[]; S._k=0;
  $("sec-body").innerHTML='<p class="tip">'+esc(S.intro||"3つの質問に、声で答えます。録音ボタンを押すと始まり、時間が来ると自動で止まります。")+'</p><div id="sp-task"></div>';
  $("sec-next").hidden=true;
  paintTask(S);
}
function paintTask(S){
  const t=S.set[S._k]; if(!t){$("sec-next").hidden=false;$("sec-next").click();return;}
  $("sp-task").innerHTML='<p class="n" style="font-family:var(--en);color:var(--brand);font-weight:900;font-size:13px;margin:0">TASK '+(S._k+1)+' / '+S.set.length+'　'+esc(t.type||"")+'　'+t.timeSec+'秒</p>'+
    '<p class="stem" style="font-family:var(--en);font-size:16px;line-height:1.5;margin:6px 0 0">'+esc(t.prompt).replace(/\n/g,"<br>")+'</p>'+(t.ja?'<p class="ja">'+esc(t.ja)+'</p>':"")+
    '<div class="rec"><button class="mic" id="sp-mic" aria-label="録音">🎤</button><small id="sp-note">押すと録音が始まります（'+t.timeSec+'秒で自動で止まります）</small></div>';
  $("sp-mic").onclick=()=>{rec?stopRec():startRec(S,t);};
}
async function startRec(S,t){
  try{recStream=recStream||await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){$("sp-note").textContent="マイクが使えませんでした。この質問は飛ばします。";A[S.id].clips.push({task:t,blob:null,sec:0});setTimeout(()=>{S._k++;paintTask(S);},1200);return;}
  const chunks=[],r=rec=new MediaRecorder(recStream);
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  r.onstop=()=>{rec=null;clearInterval(recTick);A[S.id].clips.push({task:t,blob:new Blob(chunks,{type:r.mimeType||"audio/mp4"}),sec:(Date.now()-recT)/1000});S._k++;paintTask(S);};
  r.start();recT=Date.now();$("sp-mic").classList.add("on");$("sp-mic").textContent="■";
  const tick=()=>{const s=Math.floor((Date.now()-recT)/1000);$("sp-note").textContent="● 録音中 "+s+" / "+t.timeSec+"秒（押すと止めて次へ）";if(s>=t.timeSec&&rec)stopRec();};
  tick();recTick=setInterval(tick,400);
}
function stopRec(){if(rec)rec.stop();}
const b64=blob=>new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(",")[1]||"");f.readAsDataURL(blob);});
async function gradeSpeaking(S){
  const clips=A[S.id].clips||[]; const out=[];
  for(let k=0;k<clips.length;k++){
    const c=clips[k]; if(!c.blob||c.sec<1){out.push({task:c.task,skipped:true});continue;}
    busy("スピーキング "+(k+1)+" / "+clips.length+" を採点しています…");
    try{const audio=await b64(c.blob);const res=await window.APushSync.call("assess",{kind:"speaking",exam:X.exam,task:c.task,audio,mime:c.blob.type,sec:Math.round(c.sec)});out.push(Object.assign({task:c.task},res.data));}
    catch(e){out.push({task:c.task,err:errJa(e)});}
  }
  const sc=out.filter(o=>o.overall!=null);
  R[S.id]={kind:"speaking",title:S.title,tasks:out,overall:sc.length?Math.floor(sc.reduce((a,o)=>a+o.overall,0)/sc.length/X.scale.step)*X.scale.step:null,note:(sc[0]||{}).note||""};
  $("sec-next").hidden=false;
}

/* ---------- 結果 ---------- */
function showResult(save){
  const sc=X.scale, parts=X.sections.map(s=>R[s.id]).filter(Boolean);
  const vals=parts.map(p=>p.band!=null?p.band:p.overall).filter(v=>v!=null);
  const overall=vals.length?Math.floor(vals.reduce((a,v)=>a+v,0)/vals.length/sc.step)*sc.step:null;
  $("r-overall").textContent=overall==null?"–":fmtBand(overall,sc);
  $("r-msg").textContent=overall==null?"採点できたパートがありませんでした。":(X.messages||{})[String(overall)]||(vals.length<X.sections.length?"採点できなかったパートは平均に入れていません。":"おつかれさまでした。下に、パートごとの結果と次の一手があります。");
  $("r-parts").innerHTML=parts.map(p=>partHtml(p,sc)).join("");
  if(save&&overall!=null)store.set(s=>{s[X.id]={at:new Date().toISOString(),overall,R};});
  if(save)try{(window.aps=window.aps||[]).push(["mark","exam",1]);}catch(e){}
  view("result");
}
function partHtml(p,sc){
  let h='<div class="card"><div class="cin">';
  if(p.kind==="listening"||p.kind==="reading"){
    h+='<div class="res"><div><b>'+(p.band!=null?fmtBand(p.band,sc):"–")+'</b><small>'+esc(p.title)+'</small></div><div>正解 '+p.ok+' / '+p.total+'</div></div>';
    h+='<details><summary class="note">答え合わせ</summary><ol class="ded">'+p.detail.map(d=>'<li>'+(d.ok?'<span class="ok-t">○</span>':'×')+' '+d.n+'　正解 <b>'+esc(d.key)+'</b>'+(d.ok?"":'　<i>あなた：'+esc(Array.isArray(d.ans)?d.ans.map(i=>"ABCDEFGH"[i]).join(", "):d.ans==null?"（無答）":typeof d.ans==="number"?"ABCDEFGH"[d.ans]:d.ans)+'</i>')+(d.why?'<br><i>'+esc(d.why)+'</i>':"")+'</li>').join("")+'</ol></details>';
  }else if(p.kind==="writing"){
    h+=assessHtml(p,sc,p.title);
  }else if(p.kind==="speaking"){
    h+='<div class="res"><div><b>'+(p.overall!=null?fmtBand(p.overall,sc):"–")+'</b><small>'+esc(p.title)+'</small></div><div class="note">'+esc(p.note||"")+'</div></div>';
    h+=(p.tasks||[]).map((t,i)=>'<details'+(i===0?" open":"")+'><summary class="note">TASK '+(i+1)+'　'+esc((t.task||{}).type||"")+(t.overall!=null?'　目安 '+fmtBand(t.overall,sc):"")+'</summary>'+assessHtml(t,sc,null)+'</details>').join("");
  }
  return h+'</div></div>';
}
function assessHtml(p,sc,title){
  if(p.skipped)return (title?'<p class="note">'+esc(title)+'：':'<p class="note">')+'答えがなかったので採点していません。</p>';
  if(p.err)return (title?'<p class="note">'+esc(title)+'：':'<p class="note">')+esc(p.err)+'</p>'+(p.text?'<div class="corr">'+esc(p.text)+'</div>':"");
  let h=title?'<div class="res"><div><b>'+fmtBand(p.overall,sc)+'</b><small>'+esc(title)+'</small></div><div class="note">'+esc(p.comment||"")+'</div></div>':'<p class="note">'+esc(p.comment||"")+'</p>';
  h+='<div class="crit">'+(p.scores||[]).map(s=>'<span>'+esc(s.ja)+'</span><b>'+fmtBand(s.score,sc)+'</b>').join("")+'</div>';
  if(p.deductions&&p.deductions.length)h+='<p class="ask">減点の理由</p><ul class="ded">'+p.deductions.map(d=>'<li>'+esc(d.what_ja)+(d.points?' <b>'+d.points+'</b>':"")+(d.where?'<br><i>「'+esc(d.where)+'」</i>':"")+'</li>').join("")+'</ul>';
  if(p.heard)h+='<p class="ask">聞き取った内容</p><div class="corr" style="color:var(--mute)">'+esc(p.heard)+'</div>';
  if(p.corrected)h+='<p class="ask">直した文</p><div class="corr">'+esc(p.corrected)+'</div>';
  if(p.next)h+='<p class="ask">次に直す1つ</p><p style="margin:0;font-weight:700">'+esc(p.next)+'</p>';
  if(p.note&&title)h+='<p class="note">'+esc(p.note)+'</p>';
  return h;
}
</script>
