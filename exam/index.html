.opts button b{font-family:var(--en);color:var(--brand);min-width:16px}
.opts button[aria-pressed="true"]{background:var(--brand);color:var(--on)}.opts button[aria-pressed="true"] b{color:var(--on)}
.opts button.ok{outline:2px solid var(--ok)}.opts button.ng{opacity:.5}

<script>
"use strict";
/* 模擬テスト・トレーニングの共通エンジン（2026-11-03）。
   ?id=ielts-1            … 決まった模擬テスト（/exam/ielts-1.json。無料版）
   ?exam=toeic            … 試験の入口（10分トレーニング・ショートタイムチャレンジ・チャプター別）
   ?exam=toeic&mode=ten   … 10分トレーニング／mode=challenge … ショートタイムチャレンジ
   ?exam=toeic&part=P5    … チャプター別トレーニング
   問題バンクの形は ~/apush/exam-src/bank/SCHEMA.md。採点（ライティング・スピーキング）は kanri の assess。 */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=new URLSearchParams(location.search);
const SITE=window.SITE||{};
const LEGACY=P.get("id"), BANK=P.get("exam"), MODE=P.get("mode"), PART=P.get("part");
let X=null;            // 今のテスト（sections を持つ）
let B=null;            // 問題バンク（?exam= の時）
let I=0;
const A={}, R={};
let timer=null, endAt=0;
const KEY=LEGACY||[BANK,MODE||("part:"+PART)].join("/");
const store={get(){try{return JSON.parse(localStorage.getItem("exam:v1"))||{};}catch(e){return{};}},set(f){try{const s=store.get();f(s);localStorage.setItem("exam:v1",JSON.stringify(s));}catch(e){}}};
function view(k){["hub","start","sec","result"].forEach(n=>{$("v-"+n).hidden=n!==k;});window.scrollTo(0,0);}
const fmtBand=(v,sc)=>v==null?"–":(sc&&sc.step>=1?String(v):Number(v).toFixed(1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const seed=Math.floor(Date.now()/864e5);
const pick=(arr,k)=>arr[(seed+(k||0))%arr.length];

/* ---------- 読み込み ---------- */
const fail=()=>{$("x-title").textContent="テストが見つかりません";$("x-sub").textContent="「戻る」から選び直してください。";};
if(LEGACY){
  fetch("/exam/"+encodeURIComponent(LEGACY)+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(x=>{X=x;paintStart();}).catch(fail);
}else if(BANK){
  fetch("/exam/"+encodeURIComponent(BANK)+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();}).then(b=>{B=b;
    if(MODE&&b.modes&&b.modes[MODE]){X=fromPicks(b,MODE);paintStart();}
    else if(PART&&b.parts.some(p=>p.id===PART)){X=fromPart(b,PART);paintStart();}
    else paintHub();
  }).catch(fail);
}else fail();

/* ---------- 試験の入口 ---------- */
const SCALE={ielts:{min:0,max:9,step:.5},eiken:{min:0,max:4,step:1},toefl:{min:0,max:5,step:.5},toeic:{min:0,max:990,step:5}};
function hubHref(q){return "/exam/?exam="+encodeURIComponent(B.exam)+q;}
function paintHub(){
  $("x-mini").textContent=B.group;$("x-exam").textContent=B.group;$("x-title").textContent=B.examName;
  $("x-sub").textContent="毎日の10分・短い模擬テスト・パートごとの集中練習";
  const m=B.modes||{};
  const desc=k=>m[k]?("約"+m[k].minutes+"分 ・ "+m[k].pick.map(pk=>(B.parts.find(p=>p.id===pk.part)||{}).title||pk.part).join("・")):"準備中";
  $("h-ten").href=hubHref("&mode=ten");$("h-ten-d").textContent=desc("ten");$("h-ten").hidden=!m.ten;
  $("h-ch").href=hubHref("&mode=challenge");$("h-ch-d").textContent=desc("challenge")+(m.challenge?" ・ 目安スコアと添削つき":"");$("h-ch").hidden=!m.challenge;
  const last=store.get();
  $("h-parts").innerHTML=B.parts.map(p=>{const n=p.sets.length,L=last[B.exam+"/part:"+p.id];
    return '<a class="mode" href="'+hubHref("&part="+encodeURIComponent(p.id))+'"><span><b>'+esc(p.title)+'</b><small>'+esc(p.desc)+' ・ '+n+(p.kind==="writing"||p.kind==="speaking"?"題":"セット")+(L&&L.pct!=null?' ・ 前回 '+Math.round(L.pct*100)+'%':"")+'</small></span><span class="go">→</span></a>';}).join("");
  $("x-back").href="/mine/";
  view("hub");
}

/* ---------- バンク → テスト（sections） ---------- */
function partSection(b,p,sets,label){
  const base={id:p.id+"-"+Math.random().toString(36).slice(2,7),part:p.id,kind:p.kind,title:label||p.title,intro:p.intro,voice:b.voice};
  if(p.kind==="writing")return Object.assign(base,{tasks:sets});
  if(p.kind==="speaking")return Object.assign(base,{sets:sets.map(s=>s.tasks)});
  // 本文の無いセット（Part 5・Part 2 など）は1つの画面にまとめる。本文・音声のあるセットは1セット1画面
  if(sets.every(s=>!s.passage&&!s.script)||sets.every(s=>s.script&&s.questions.length===1&&!s.passage))
    return [Object.assign(base,{questions:[].concat(...sets.map(s=>s.questions.map(q=>Object.assign({},q,{script:s.script,set:s.id}))))})];
  return sets.map((s,i)=>Object.assign({},base,{id:base.id+i,passage:s.passage,script:s.script,questions:s.questions.map(q=>Object.assign({},q,{set:s.id})),title:sets.length>1?base.title+"（"+(i+1)+"/"+sets.length+"）":base.title}));
}
function fromPicks(b,mode){
  const m=b.modes[mode], secs=[];
  m.pick.forEach(pk=>{const p=b.parts.find(x=>x.id===pk.part);if(!p)return;
    const n=pk.sets||pk.items||1, sets=shuffle(p.sets.slice()).slice(0,n);
    const s=partSection(b,p,sets);[].concat(s).forEach(x=>secs.push(x));});
  // 制限時間：モードの分数を、各セクションの目安秒数の比で分ける
  // 聞く問題は、読み上げの時間（1秒に約2.3語）も足す
  const wc=t=>String(t||"").split(/\s+/).filter(Boolean).length;
  const audio=s=>s.kind!=="listening"?0:s.script?wc(s.script):s.questions.reduce((a,q)=>a+wc(q.script)+(q.spoken?wc(q.choices.join(" ")):0),0);
  const per=s=>(b.parts.find(p=>p.id===s.part)||{}).secPerItem||30;
  // 書く・話すは決めた時間のまま。ただし書く問題は全体の35%まで（本番の20分を25分のチャレンジに入れない）
  const fixed=s=>s.kind==="writing"?Math.round(Math.min(per(s)||300,m.minutes*60*.35)/30)*30:s.kind==="speaking"?150:0;
  const est=secs.map(s=>fixed(s)?0:(audio(s)/2.3+s.questions.length*per(s)));
  const tot=est.reduce((a,v)=>a+v,0)||1, avail=Math.max(60,m.minutes*60-secs.reduce((a,s)=>a+fixed(s),0));
  secs.forEach((s,i)=>{s.sec=s.kind==="speaking"?0:s.kind==="writing"?fixed(s):Math.max(60,Math.round(est[i]/tot*avail/30)*30);});
  return {bank:true,exam:b.exam,examName:b.examName,assess:b.assess,score:b.score,scale:SCALE[(b.score||{}).kind]||SCALE.ielts,
    title:mode==="ten"?"10分トレーニング":"ショートタイムチャレンジ",minutes:m.minutes,

function qHtml(q,n,S,perQ){

function bindQ(q,n,S){

const norm=s=>String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,"").trim().replace(/\s+/g," ");

/* 読み上げ：行ごと。行頭の M: W: で声を変える（無ければ1つの声） */
function voicesFor(lang){const vs=speechSynthesis.getVoices().filter(x=>x.lang.replace("_","-").indexOf(lang.slice(0,2))===0);const exact=vs.filter(x=>x.lang.replace("_","-")===lang);return (exact.length?exact:vs);}
function speakAll(text,lang){
  if(!("speechSynthesis" in window)){alert("この端末では読み上げができません。");return;}
  const vs=voicesFor(lang); const who={};
  String(text).split(/\n+/).forEach(line=>{
    const m=/^\s*([A-Z][A-Za-z0-9]{0,5}):\s*(.*)$/.exec(line); let tag="", body=line;
    if(m&&!/^(Question|Questions|Q)$/.test(m[1])){tag=m[1];body=m[2];}
    if(!body.trim())return;

      const k=tag?who[tag]:0;if(vs.length)u.voice=vs[(k*Math.max(1,Math.floor(vs.length/3)))%vs.length];

  });

/* ---------- 目安スコア（読む・聞くの正答率から） ---------- */
const IELTS_RAW=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[7,3.5],[0,3]];
function lrBand(pct){
  const k=(X.score||{}).kind||X.exam;

}
function headline(parts){

  const pct=list=>{const t=list.reduce((a,p)=>a+p.total,0);return t?list.reduce((a,p)=>a+p.ok,0)/t:null;};
  if(!X.bank)return null;   // 決まった模擬テストは今まで通り
  const all=pct(lr);
  // チャプター別の練習は問題が少ないので、スコアには換算しない
  if(X.part&&lr.length)return {value:all==null?"–":Math.round(all*100)+"%",label:"正答率",pct:all};
  if(k==="toeic"){
    const L=pct(lr.filter(p=>p.kind==="listening")),Rr=pct(lr.filter(p=>p.kind==="reading"));
    const est=v=>v==null?null:Math.max(5,Math.min(495,Math.round((5+490*v)/5)*5));

  }
  if(k==="eiken"){
    const pass=(X.score||{}).passRate||.62;
    return {value:all==null?"–":Math.round(all*100)+"%",label:"正答率（合格ラインの目安 "+Math.round(pass*100)+"%）",pct:all,
      msg:all==null?"":all>=pass?"合格ラインの目安を越えています。ライティングと二次も同じ調子で。":"合格ラインの目安まで、あと "+Math.ceil((pass-all)*100)+"ポイント。間違えた問題の解説から見直しましょう。"};
  }
  if(k==="toefl"){   // 2026年1月からの新形式：各セクション 1〜6（0.5刻み）
    const band=v=>v==null?null:Math.round((1+5*v)*2)/2;
    const L=pct(lr.filter(p=>p.kind==="listening")),Rr=pct(lr.filter(p=>p.kind==="reading"));
    const t=[Rr!=null?"Reading "+band(Rr).toFixed(1):"",L!=null?"Listening "+band(L).toFixed(1):""].filter(Boolean).join(" ／ ");
    return {value:all==null?"–":band(all).toFixed(1),label:"1〜6 のバンドの目安"+(t?"（"+t+"）":""),pct:all};

}

    overall=vals.length?Math.floor(vals.reduce((a,v)=>a+v,0)/vals.length/sc.step)*sc.step:null;
    $("r-overall").textContent=overall==null?"–":fmtBand(overall,sc);$("r-label").textContent="総合の目安";
    $("r-msg").textContent=overall==null?"採点できたパートがありませんでした。":(X.messages||{})[String(overall)]||(vals.length<X.sections.length?"採点できなかったパートは平均に入れていません。":"おつかれさまでした。下に、パートごとの結果と次の一手があります。");
  }
  $("r-parts").innerHTML=parts.map(p=>partHtml(p,sc)).join("");
  if(save)store.set(s=>{s[KEY]=X.bank?{at:new Date().toISOString(),pct:H&&H.pct}:{at:new Date().toISOString(),overall,R};});
  if(save)try{(window.aps=window.aps||[]).push(["mark","exam",1]);}catch(e){}
  view("result");
}
function partHtml(p,sc){
  let h='<div class="card"><div class="cin">';
  if(p.kind==="listening"||p.kind==="reading"){
    h+='<div class="res"><div><b>'+(p.band!=null?fmtBand(p.band,sc):Math.round(p.ok/p.total*100)+"%")+'</b><small>'+esc(p.title)+'</small></div><div>正解 '+p.ok+' / '+p.total+'</div></div>';
    h+='<details'+(X.part?" open":"")+'><summary class="note">答え合わせと解説</summary><ol class="ded">'+p.detail.map(d=>'<li>'+(d.ok?'<span class="ok-t">○</span>':'×')+' '+d.n+'　正解 <b>'+esc(d.key)+'</b>'+(d.ok?"":'　<i>あなた：'+esc(d.ans)+'</i>')+(d.q?'<br><i>'+esc(d.q)+'</i>':"")+(d.why?'<br>'+esc(d.why):"")+(d.script?'<div class="script">'+esc(d.script)+'</div>':"")+'</li>').join("")+'</ol>'+(p.script?'<p class="ask">音声のスクリプト</p><div class="script">'+esc(p.script)+'</div>':"")+'</details>';
  }else if(p.kind==="writing"){
    h+=assessHtml(p,assessScale(),p.title);
  }else if(p.kind==="speaking"){
    h+='<div class="res"><div><b>'+(p.overall!=null?fmtBand(p.overall,assessScale()):"–")+'</b><small>'+esc(p.title)+'</small></div><div class="note">'+esc(p.note||"")+'</div></div>';
    h+=(p.tasks||[]).map((t,i)=>'<details'+(i===0?" open":"")+'><summary class="note">TASK '+(i+1)+'　'+esc((t.task||{}).type||"")+(t.overall!=null?'　目安 '+fmtBand(t.overall,assessScale()):"")+'</summary>'+assessHtml(t,assessScale(),null)+'</details>').join("");
  }
  return h+'</div></div>';
}
const assessScale=()=>SCALE[X.assess||X.exam]||X.scale;
function assessHtml(p,sc,title){
  if(p.skipped)return (title?'<p class="note">'+esc(title)+'：':'<p class="note">')+'答えがなかったので採点していません。</p>';
  if(p.err)return (title?'<p class="note">'+esc(title)+'：':'<p class="note">')+esc(p.err)+'</p>'+(p.text?'<div class="corr">'+esc(p.text)+'</div>':"");
  let h=title?'<div class="res"><div><b>'+fmtBand(p.overall,sc)+'</b><small>'+esc(title)+'</small></div><div class="note">'+esc(p.comment||"")+'</div></div>':'<p class="note">'+esc(p.comment||"")+'</p>';
  h+='<div class="crit">'+(p.scores||[]).map(s=>'<span>'+esc(s.ja)+'</span><b>'+fmtBand(s.score,sc)+'</b>').join("")+'</div>';
  if(p.deductions&&p.deductions.length)h+='<p class="ask">減点の理由</p><ul class="ded">'+p.deductions.map(d=>'<li>'+esc(d.what_ja)+(d.points?' <b>'+d.points+'</b>':"")+(d.where?'<br><i>「'+esc(d.where)+'」</i>':"")+'</li>').join("")+'</ul>';
  if(p.heard)h+='<p class="ask">聞き取った内容</p><div class="corr" style="color:var(--mute)">'+esc(p.heard)+'</div>';
  if(p.corrected)h+='<p class="ask">直した文</p><div class="corr">'+esc(p.corrected)+'</div>';
  if(p.next)h+='<p class="ask">次に直す1つ</p><p style="margin:0;font-weight:700">'+esc(p.next)+'</p>';
  if(p.note&&title)h+='<p class="note">'+esc(p.note)+'</p>';
  return h;
}
</script>
