  <section class="q" data-on id="q1">

    </div>
    <textarea class="goaltext" id="why" maxlength="200" placeholder="一言で。例：海外の取引先と自分の言葉で話したい"></textarea>
    <button class="primary" id="n1" disabled>テストへ進む</button>

<script src="/activity.js"></script>
<script>
const $=id=>document.getElementById(id);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const G=Object.assign({},get("ap_goals",{}));
const A={purpose:G.purpose||"",exam:G.target||""};
/* 専門（土木など）の生徒だけ、4つ目の選択肢 */
(function(){const tr=get("ap_track",null);if(tr&&tr.words){$("p-special").hidden=false;$("p-track").textContent=tr.label||tr.words;}})();
function pick(id,key,after){
  $(id).addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;
    [...$(id).children].forEach(x=>x.setAttribute("aria-pressed",String(x===b)));A[key]=b.dataset.v;if(after)after();});
}
const ok1=()=>{$("n1").disabled=!(A.purpose&&(A.purpose!=="exam"||A.exam)&&$("why").value.trim());};
pick("purpose","purpose",()=>{$("exam").hidden=A.purpose!=="exam";ok1();});
pick("exam","exam",ok1);
$("why").addEventListener("input",ok1);
/* 「いつ」は30分きざみ（LINE の今日のPUSHが 0分・30分に走る） */
const half=t=>{const [h,m]=String(t||"21:00").split(":").map(Number);const mm=m<15?0:m<45?30:0,hh=m<45?h:(h+1)%24;return (hh<10?"0":"")+hh+":"+(mm?"30":"00");};
$("n1").onclick=()=>{
  const TODAY=new Date().toLocaleDateString("sv");
  const why=$("why").value.trim().slice(0,200);
  Object.assign(G,{purpose:A.purpose,target:A.purpose==="exam"?A.exam:"",why,words:+G.words||20,hours:+G.hours||.5,at:half(G.at||"21:00")});   /* 語数・時間・いつは聞かない（前の値か 20語・30分・21:00。計画のページで変えられる） */   /* exam は計画のページの「1日のテスト回数」なので、試験名は target */
  if(!G.m3Text)G.m3Text=why;   /* 3か月のゴールが空なら、この一言を入れる（進捗の LINE・先生の画面が読む） */
  if(!G.m3Start)G.m3Start=TODAY;
  const h=(G.hist||[]).filter(x=>x.from!==TODAY);h.push({from:TODAY,words:G.words,shadow:G.shadow||1,exam:+G.exam||0});G.hist=h;
  put("ap_goals",G);
  try{window.aps.push(["plan",G]);}catch(e){}
  location.replace("/words/check.html?full=1");
};
</script>
